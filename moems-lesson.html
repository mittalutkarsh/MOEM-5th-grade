<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lesson: one guided problem per move · MOEMS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet"><style>
/* Math notebook: graph-paper ground, navy fountain-pen ink, a yellow highlighter, a red correction pen.
   Two typefaces: Atkinson Hyperlegible (text, built for young readers) and Kalam (the handwritten voice). */
:root{
  --paper:#FBFCFE; --sheet:#FFFFFF; --rule:#DCE5F2; --rule2:#C9D6EA;
  --ink:#1C2A4A; --pencil:#5E6A82; --faint:#8E99AE;
  --hl:#FFE45E; --hl-soft:#FFF4B8; --red:#C23A2E; --green:#1E7A50; --blue:#2D6BD0;
  --p1:#2D6BD0; --p2:#D98A00; --p3:#7B4CC0; --p4:#1E7A50; --p5:#138A8A; --p6:#C2407A;
  --console:#14223F; --console-ink:#DDE6F6;
  --hand:"Kalam","Comic Neue","Segoe Print",cursive;
  --text:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:5px; --r-md:9px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
body.reading{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:local}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--hand);font-weight:700;line-height:1.15;color:var(--ink);margin:0 0 .4em}
h1{font-size:2.5rem}
h2{font-size:1.9rem}
h3{font-size:1.4rem}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%)}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:var(--r-sm);padding:.35em .8em;font-size:.95rem}
.btn:hover{background:var(--hl-soft)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2B3E68}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.warn{border-color:var(--red);color:var(--red)}
kbd{font-family:var(--text);border:1px solid var(--rule2);border-bottom-width:2px;border-radius:4px;padding:0 .3em;font-size:.85em}

/* ---------- equations ---------- */
.eq{font-size:1.35rem;text-align:center;padding:.7em .6em;margin:.2em 0 1em;border-left:4px solid var(--ink);
  background:var(--sheet);display:flex;flex-wrap:wrap;gap:.35em;align-items:center;justify-content:center}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .15em}
.frac>span:first-child{border-bottom:1.5px solid var(--ink);padding:0 .25em}
.frac>span:last-child{padding:0 .25em}
.binom{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;padding:0 .35em;position:relative;line-height:1.1}
.binom::before,.binom::after{content:"";position:absolute;top:0;bottom:0;width:.35em;border:1.5px solid var(--ink)}
.binom::before{left:0;border-right:none;border-radius:.6em 0 0 .6em}
.binom::after{right:0;border-left:none;border-radius:0 .6em .6em 0}
.eqnote{font-size:.85rem;color:var(--pencil)}

/* ---------- SVG pictures ---------- */
svg.pic{width:100%;height:auto;max-height:340px;display:block;margin:0 auto;font-family:var(--text);overflow:visible}
.pic .t,.pic .cap{fill:var(--pencil);font-size:12px}
.pic .vert{writing-mode:tb}
.pic .chip{fill:#fff;stroke:var(--ink);stroke-width:1.3}
.pic .chip.picked{fill:var(--hl);stroke:var(--ink)}
.pic .chip.used{fill:#EEF1F6;stroke:#B6BECC}
.pic .chip.banned{fill:#FBE9E7;stroke:var(--red)}
.pic .chiptxt{fill:var(--ink);font-size:13px;font-weight:700}
.pic .chiptxt.used{fill:#9AA4B5}
.pic .strike{stroke-width:2;stroke-linecap:round}
.pic .strike.used{stroke:#9AA4B5}
.pic .strike.banned{stroke:var(--red)}
.pic .strike.big{stroke-width:3.5;opacity:.85}
.pic .sub{font-size:9px}
.pic .chip.p1,.pic .tile.p1{fill:#E1ECFC;stroke:var(--p1)}
.pic .chip.p2,.pic .tile.p2{fill:#FCEFD6;stroke:var(--p2)}
.pic .chip.p3,.pic .tile.p3{fill:#ECE3F8;stroke:var(--p3)}
.pic .chip.p4,.pic .tile.p4{fill:#DEF1E7;stroke:var(--p4)}
.pic .chip.p5,.pic .tile.p5{fill:#DAF0F0;stroke:var(--p5)}
.pic .chip.p6,.pic .tile.p6{fill:#F8E1EB;stroke:var(--p6)}
.pic .tile{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.pic .tile.real{fill:var(--hl)}
.pic .tile.pl{fill:#F1F3F7;stroke:#9AA4B5}
.pic .tilet{fill:var(--ink);font-size:16px;font-weight:700}
.pic .tilet.sm{font-size:13px}
.pic .slot{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.pic .result{fill:var(--hl);stroke:var(--ink);stroke-width:1.6}
.pic .fracline{stroke:var(--ink);stroke-width:1.6}
.pic .numbox{fill:#fff;stroke:var(--ink);stroke-width:1.2}
.pic .slotlab{fill:var(--pencil);font-size:12px}
.pic .slotn,.pic .calcn{fill:var(--ink);font-size:20px;font-weight:700}
.pic .op{fill:var(--ink);font-size:22px;font-weight:700}
.pic .op.big{font-size:30px}
.pic .card{fill:#fff;stroke:var(--rule2)}
.pic .arrow{stroke:var(--ink);stroke-width:2;fill:none}
.pic .ahead{fill:var(--ink)}
.pic .groupbox{fill:var(--hl-soft);stroke:var(--ink);stroke-width:1.6}
.pic .groupt{fill:var(--ink);font-size:17px;font-weight:700}
.pic .pg-cell{fill:#fff;stroke:var(--rule2);stroke-width:1}
.pic .pg-cell.diag{fill:#FBE9E7}
.pic .pg-cell.lower{fill:#EEF1F6}
.pic .pg-cell.hl,.pic .pg-cell.twin-lit{fill:var(--hl);stroke:var(--ink)}
.pic .pg-cell:hover{stroke:var(--ink);stroke-width:2}
.pic .pgt{fill:var(--ink);pointer-events:none}
.pic .pgt.dim{fill:#9AA4B5}
.pic .gridlab{fill:var(--ink);font-size:13px;font-weight:700}
.pic .edge{stroke:var(--pencil);stroke-width:1.3}
.pic .tnode{fill:#fff;stroke:var(--rule2)}
.pic .nodet{fill:var(--ink);font-size:12px;font-weight:700}
.pic .node.root{fill:var(--ink)}
.pic .rowhl{fill:var(--hl-soft)}
.pic .brace{fill:none;stroke:var(--ink);stroke-width:1.6}
.pic .seg{stroke:var(--faint);stroke-width:1.6}
.pic .seg.hl{stroke:var(--blue);stroke-width:4;stroke-linecap:round;opacity:.85}
.pic .seg.hl2{stroke:var(--p2);stroke-width:4;stroke-linecap:round;opacity:.8}
.pic .dot{fill:var(--ink)}
.pic .dotlab{fill:var(--ink);font-size:13px;font-weight:700}
.pic .gl{stroke:var(--rule2);stroke-width:1.3}
.pic .gl.hlv{stroke:var(--blue);stroke-width:3.5}
.pic .gl.hlh{stroke:var(--green);stroke-width:3.5}
.pic .numv{fill:var(--blue);font-weight:700}
.pic .numh{fill:var(--green);font-weight:700}
.pic .shade{fill:var(--hl);opacity:.6}
.pic .path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pic .path.leg1{stroke:var(--blue)}
.pic .path.leg2{stroke:var(--p2);stroke-dasharray:7 4}
.pic .bag{fill:#F4F7FC;stroke:var(--ink);stroke-width:1.5}
.pic .oval{fill:none;stroke:var(--hl);stroke-width:8;opacity:.9}
.pic .oval.diff{stroke:#F2C2BC}
.pic .lcell{fill:#fff;stroke:var(--rule2)}
.pic .lcell.hl{fill:var(--hl)}
.pic .lt{fill:var(--ink);font-size:13px;font-weight:700}
.pic .wcard{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.pic .wcard.skip{fill:#F3F5F9;stroke:#B6BECC;stroke-dasharray:5 4}
.pic .cardt{fill:var(--ink);font-size:15px}
.pic .coin.gold{fill:#F7D774;stroke:#9A7400}
.pic .coin.silver{fill:#E3E7EE;stroke:#7D8696}
.pic .coint{fill:var(--ink);font-size:11px;font-weight:700}
.pic .badring{fill:none;stroke:var(--red);stroke-width:2.5}
.pic .state{fill:#fff;stroke:var(--rule2)}
.pic .state.picked{fill:var(--hl-soft);stroke:var(--ink)}
.pic .person{fill:var(--hl-soft);stroke:var(--ink)}
.pic .persont{fill:var(--ink);font-weight:700;font-size:13px}
.hstack{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.hstack>svg.pic{width:100%;flex:1 1 200px;min-width:0}
.vstack{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.vstack>svg.pic{width:100%}
.ptable{border-collapse:collapse;margin:0 auto;font-size:.92rem;background:#fff}
.ptable th,.ptable td{border:1px solid var(--rule2);padding:.25em .6em;text-align:center}
.ptable th{background:#EEF3FA;font-weight:700}
.ptable tr.hl td{background:var(--hl-soft);font-weight:700}

/* ---------- story component ---------- */
.story{container-type:inline-size;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem;margin:.6rem 0 1.2rem}
.story:focus-visible{outline:3px solid var(--blue)}
.story .frame{display:none;margin:0}
.story .frame.on{display:block}
.story.all .frame{display:block;border-bottom:1px dashed var(--rule2);padding-bottom:.8rem;margin-bottom:.8rem}
.frame .pic-wrap{min-height:80px;display:flex;align-items:center;justify-content:center;overflow-x:auto}
.frame figcaption{margin-top:.5rem}
.frame figcaption p{margin:.2em 0}
.frame .ftitle{font-family:var(--hand);font-size:1.15rem;margin:0 0 .3rem}
.frame.skip .ftitle{text-decoration:line-through;color:var(--faint)}
.frame.skip figcaption p{color:var(--pencil)}
.ask{margin-top:.5rem;padding:.4rem .7rem;border-left:4px solid var(--hl);background:#FFFBE6;font-size:.95rem}
.ask b{font-family:var(--hand)}
.story-ctl{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;padding:0}
.dots button.on{background:var(--ink)}
.dots button.seen{background:var(--rule2)}
.story-ctl label{font-size:.9rem;color:var(--pencil);margin-left:auto}
.story.all .story-ctl .nav{visibility:hidden}

/* plan-guided: flowchart beside picture on wide containers, step strip on narrow */
.wbody{display:block}
.plan-side{display:none}
.plan-strip{display:flex;gap:4px;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
.plan-strip span{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule2);display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;color:var(--pencil)}
.plan-strip span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan-strip span.skipd{text-decoration:line-through}
.plan-strip .stepname{font-family:var(--hand);font-size:1.1rem;color:var(--ink);margin-left:.4rem;width:auto;height:auto;border:none;justify-content:flex-start}
@container (min-width:680px){
  .wbody{display:grid;grid-template-columns:215px 1fr;gap:1rem}
  .plan-side{display:block}
  .plan-strip{display:none}
}
.plan-side ol{list-style:none;margin:0;padding:0;counter-reset:pl}
.plan-side li{counter-increment:pl;padding:.35rem .5rem .35rem 2.1rem;position:relative;font-size:.9rem;color:var(--pencil);border-radius:6px;margin-bottom:3px}
.plan-side li::before{content:counter(pl);position:absolute;left:.4rem;top:.3rem;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.plan-side li.on{background:var(--hl);color:var(--ink);font-weight:700}
.plan-side li.on::before{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan-side li.skipd{text-decoration:line-through}
.plan-side li+li::after{content:"";position:absolute;left:1.05rem;top:-4px;height:5px;border-left:1.5px solid var(--rule2)}

/* ---------- reading pages ---------- */
.page{max-width:1180px;margin:0 auto;padding:1.4rem 1.2rem 4rem;display:grid;grid-template-columns:230px minmax(0,1fr);gap:2rem}
.toc{position:sticky;top:1rem;align-self:start;max-height:calc(100vh - 2rem);overflow:auto;font-size:.92rem;background:var(--sheet);
  border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem}
.toc a{display:block;text-decoration:none;color:var(--ink);padding:.15rem .3rem;border-radius:4px}
.toc a:hover{background:var(--hl-soft)}
.toc .sub{padding-left:1rem;font-size:.86rem;color:var(--pencil)}
main.reading-main{min-width:0}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:1.3rem 1.4rem;margin-bottom:1.6rem}
.sheet>p,.sheet li{max-width:72ch}
.idea{font-size:1.1rem;font-weight:700}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.chips a{border:1.5px solid var(--ink);border-radius:999px;padding:.1rem .7rem;text-decoration:none;color:var(--ink);font-size:.9rem;background:#fff}
.chips a:hover{background:var(--hl)}
.fromclass{border-left:4px solid var(--blue);background:#F1F6FE;padding:.6rem .8rem;margin:.8rem 0;font-size:.95rem}
.fromclass b{font-family:var(--hand)}
.traps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;padding:0;list-style:none}
.traps li{background:#fff;border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.7rem .9rem;max-width:none}
.traps .wrong{color:var(--red);font-weight:700;text-decoration:line-through;text-decoration-thickness:2px}
.cheat{width:100%;border-collapse:collapse}
.cheat td,.cheat th{border:1px solid var(--rule2);padding:.4rem .6rem;vertical-align:top;text-align:left}
.cheat th{background:#EEF3FA}
dl.gloss dt{font-weight:700;margin-top:.6rem}
dl.gloss dd{margin:0 0 0 1rem;max-width:70ch}
.site-head{display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap;padding:1rem 1.2rem 0;max-width:1180px;margin:0 auto}
.site-head nav a{margin-right:1rem}
.lede{font-size:1.15rem;max-width:62ch}

/* ---------- workbench ---------- */
body.bench{height:100vh;overflow:hidden;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:.6rem;padding:.45rem .8rem;border-bottom:1.5px solid var(--ink);background:var(--sheet);flex-wrap:wrap}
.topbar .brand{font-family:var(--hand);font-weight:700;font-size:1.25rem;margin-right:.4rem}
.topbar select{font:inherit;font-size:.92rem;padding:.25rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);max-width:280px}
.topbar .meta{font-size:.9rem;color:var(--pencil);display:flex;gap:1rem;align-items:center}
.topbar .links{margin-left:auto;display:flex;gap:.8rem;font-size:.92rem}
.benchgrid{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(360px,430px)}
.rail{border-right:1.5px solid var(--ink);overflow:auto;padding:.5rem;background:var(--paper)}
.rail h4{font-family:var(--hand);font-size:1.05rem;margin:.6rem 0 .2rem}
.rail button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;border:none;background:none;padding:.25rem .4rem;border-radius:5px;font-size:.92rem;color:var(--ink)}
.rail button:hover{background:var(--hl-soft)}
.rail button.cur{background:var(--hl);font-weight:700}
.sdot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--pencil);flex:none}
.sdot.prog{background:linear-gradient(90deg,var(--blue) 50%,#fff 50%);border-color:var(--blue)}
.sdot.closed{background:var(--green);border-color:var(--green)}
.middle{overflow:auto;padding:0 1rem 1rem;background:var(--paper)}
.tabs{display:flex;gap:.2rem;position:sticky;top:0;background:var(--paper);padding-top:.5rem;z-index:2;border-bottom:1.5px solid var(--ink)}
.tabs button{border:1.5px solid var(--ink);border-bottom:none;border-radius:7px 7px 0 0;background:#EEF3FA;padding:.3rem .9rem;margin-bottom:-1.5px;font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--sheet);font-weight:700}
.tabpanel{padding-top:.8rem}
.ptext{font-size:1.08rem;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem 1rem}
.pfig{max-width:380px;margin:.8rem auto 0}
.pfig svg.pic{max-height:300px}
.pfig .pic .gl{stroke:var(--ink);stroke-width:1.2}
.pnote{font-size:.9rem;color:var(--pencil);margin:.5rem 0}
.inclass{display:inline-block;font-size:.85rem;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:0 .6rem;margin-right:.4rem}
.above{display:inline-block;font-size:.85rem;border:1px solid var(--p3);color:var(--p3);border-radius:999px;padding:0 .6rem}
.verified{margin-top:1rem;border:2px solid var(--green);border-radius:var(--r-md);background:#F2FAF5;padding:.8rem 1rem}
.verified h3{color:var(--green)}
.right{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0;background:var(--sheet)}
.rscroll{overflow:auto;padding:.7rem .8rem;flex:1;min-height:0}
.pills{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem}
.pills button{border:1.5px solid var(--ink);border-radius:999px;background:#fff;padding:.05rem .65rem;font-size:.88rem}
.pills button.cur{outline:3px solid var(--hl);outline-offset:1px;font-weight:700}
.pills button.ok{background:#DDF1E5;border-color:var(--green)}
.pills button.handed{background:#FBE9E7;border-color:var(--red)}
.pills button.tried{background:#EEF3FA}
.stepq{font-weight:700;margin:.2rem 0 .5rem}
.editor{display:flex;border:1.5px solid var(--ink);border-radius:var(--r-sm);height:140px;background:#fff;
  background-image:linear-gradient(transparent 23px,var(--rule) 23px);background-size:100% 24px;background-position:0 6px}
.gutter{width:2.2rem;text-align:right;padding:6px .35rem 0 0;color:var(--faint);font-size:.85rem;line-height:24px;overflow:hidden;border-right:1px solid var(--rule2);user-select:none}
.editor textarea{flex:1;border:none;resize:none;padding:6px .5rem 0;font:inherit;font-size:.95rem;line-height:24px;background:transparent;color:var(--ink);font-family:var(--hand)}
.editor textarea:focus{outline:none}
.editor:focus-within{outline:3px solid var(--blue);outline-offset:1px}
.ansrow{display:flex;gap:.4rem;margin:.6rem 0}
.ansrow input{flex:1;font:inherit;padding:.35rem .5rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);min-width:0}
.btnrow{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.console{background:var(--console);color:var(--console-ink);font-size:.86rem;padding:.6rem .7rem;height:170px;overflow:auto;border-top:1.5px solid var(--ink);flex:none}
.console div{margin-bottom:.3rem;line-height:1.4}
.console .ok{color:#8BE0AC}
.console .bad{color:#FFB3A8}
.console .info{color:#A9C3F0}
.console .hand{color:#FFE45E}
.console .ts{color:#6F84AD;margin-right:.4rem}
.dialog-back{position:fixed;inset:0;background:rgba(28,42,74,.35);display:none;align-items:center;justify-content:center;z-index:50}
.dialog-back.open{display:flex}
.dialog{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--r-md);max-width:460px;padding:1rem 1.2rem;margin:1rem}
.dialog h3{margin-top:0}
.confirm-note{font-size:.88rem;color:var(--red);margin:.3rem 0}
.rules{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem 1rem}
.rules ol{padding-left:1.3rem;margin:.3rem 0}
.mysteps .ms{background:var(--sheet);border:1px solid var(--rule2);border-radius:var(--r-sm);padding:.5rem .7rem;margin-bottom:.5rem}
.mysteps pre{white-space:pre-wrap;font-family:var(--hand);margin:.3rem 0;font-size:.95rem}
.railtoggle{display:none}

/* ---------- pen ---------- */
.pen-canvas{position:fixed;inset:0;pointer-events:none;z-index:40}
.pen-canvas.active{pointer-events:auto;cursor:crosshair}
.pen-canvas.active.touchpass{touch-action:pan-x pan-y pinch-zoom}
.pen-canvas.active.swallow{touch-action:none}
.pen-bar{position:fixed;right:12px;bottom:12px;z-index:45;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);
  padding:.35rem;display:flex;gap:.25rem;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px);box-shadow:0 2px 0 var(--ink)}
.pen-bar button{border:1.5px solid transparent;background:none;border-radius:6px;min-width:30px;height:30px;padding:0 .35rem;font-size:.85rem;color:var(--ink)}
.pen-bar button[aria-pressed="true"]{border-color:var(--ink);background:var(--hl)}
.pen-bar .sw{width:20px;height:20px;border-radius:50%;display:inline-block;vertical-align:middle;border:1.5px solid var(--ink)}
.pen-bar .tools{display:none;gap:.2rem;align-items:center;flex-wrap:wrap}

b> What is the question really asking for, in your own words?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Draw every fact<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 328 162\" role=\"img\" aria-label=\"each girl&#x27;s half and her time\" style=\"max-width:476px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"117\" y=\"31\" class=\"barname\" text-anchor=\"end\">Belle&#x27;s half<\/text><rect x=\"125\" y=\"10\" width=\"50\" height=\"30\" class=\"unit hl\"/><rect x=\"175\" y=\"10\" width=\"50\" height=\"30\" class=\"unit hl\"/><text x=\"233\" y=\"31\" class=\"barright\" text-anchor=\"start\">2 h<\/text><text x=\"117\" y=\"93\" class=\"barname\" text-anchor=\"end\">Maggie&#x27;s half<\/text><rect x=\"125\" y=\"72\" width=\"50\" height=\"30\" class=\"unit \"/><rect x=\"175\" y=\"72\" width=\"50\" height=\"30\" class=\"unit \"/><rect x=\"225\" y=\"72\" width=\"50\" height=\"30\" class=\"unit \"/><text x=\"283\" y=\"93\" class=\"barright\" text-anchor=\"start\">3 h<\/text><text x=\"164.0\" y=\"156\" class=\"cap\" text-anchor=\"middle\">each square = 1 hour \u00b7 whole room: Belle 4 h, Maggie 6 h<\/text><\/svg><\/div><figcaption><p>Belle helps as soon as she&#x27;s done, so both paint the whole time.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why can we use whole-room times?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Make the move<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 278 140\" role=\"img\" aria-label=\"rooms in a 12-hour block\" style=\"max-width:403px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"62\" y=\"31\" class=\"barname\" text-anchor=\"end\">Belle<\/text><rect x=\"70\" y=\"10\" width=\"40\" height=\"30\" class=\"unit hl\"/><rect x=\"110\" y=\"10\" width=\"40\" height=\"30\" class=\"unit hl\"/><rect x=\"150\" y=\"10\" width=\"40\" height=\"30\" class=\"unit hl\"/><text x=\"198\" y=\"31\" class=\"barright\" text-anchor=\"start\">3 rooms<\/text><text x=\"62\" y=\"93\" class=\"barname\" text-anchor=\"end\">Maggie<\/text><rect x=\"70\" y=\"72\" width=\"40\" height=\"30\" class=\"unit hl\"/><rect x=\"110\" y=\"72\" width=\"40\" height=\"30\" class=\"unit hl\"/><text x=\"158\" y=\"93\" class=\"barright\" text-anchor=\"start\">2 rooms<\/text><\/svg><\/div><figcaption><p>Move: Same time block. A 12-hour block: Belle paints 3 rooms, Maggie 2. Together 5.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Make the move<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 371 70\" role=\"img\" aria-label=\"one room\" style=\"max-width:538px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"64.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">720 min<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"166\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"181.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"244\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"298.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">144 min<\/text><\/svg><\/div><figcaption><p>One room takes 144 minutes = 2 h 24 min. Noon + 2:24 = 2:24 p.m.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why 12 hours for the block?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check every fact<\/p><div class=\"pic-wrap\"><table class=\"ledger\"><thead><tr><th>Fact from the problem<\/th><th>With our answer<\/th><th><\/th><\/tr><\/thead><tbody><tr><td class=\"fact\">Belle&#x27;s half in 2 h<\/td><td>at 2:00 Belle is done, Maggie \u2154 done<\/td><td class=\"tick y\">\u2713<\/td><\/tr><tr><td class=\"fact\">Maggie&#x27;s half in 3 h<\/td><td>the last \u2153 of her half: both together 24 " class=\"calcn\" text-anchor=\"middle\">0<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"244\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"259.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">8<\/text><\/svg><\/div><figcaption><p>The 3\u00d73 square holds five odds: odd sum.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why do two odd numbers make an even sum?<\/div><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check every fact<\/p><div class=\"pic-wrap\"><table class=\"ledger\"><thead><tr><th>Fact from the problem<\/th><th>With our answer<\/th><th><\/th><\/tr><\/thead><tbody><tr><td class=\"fact\">even number or even sum<\/td><td>4 singles, 4 doubles<\/td><td class=\"tick y\">\u2713<\/td><\/tr><tr><td class=\"fact\">any size<\/td><td>the 3\u00d73 checked: 45 is odd<\/td><td class=\"tick y\">\u2713<\/td><\/tr><\/tbody><\/table><p class=\"wrongline\"><span class=\"wrongv\">9<\/span> counts the 3\u00d73 square, but its sum is odd.<\/p><\/div><figcaption><p>Put the answer back into every fact. Every row gets a \u2713. The crossed-out number is the tempting answer, and what it really counts.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which fact would catch a wrong answer fastest?<\/div><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "8", "check": "Four 1\u00d71 (2, 4, 6, 8), all four 2\u00d72 (sums 12, 16, 24, 28), and the 3\u00d73 sum 45 is odd: 8 squares.", "concept": "c12", "inclass": null, "above": false, "note": "Official MOEMS problem: 2019\u201320 Division E, Contest 2, 2B.", "figure": null, "source": "2019\u201320 Division E, Contest 2, 2B"}], "concepts": {"c1": "<h2>Undo it<\/h2><div class=\"eq\" role=\"math\"><span>start<\/span><span>=<\/span><span>end<\/span><span>\u2192<\/span><span>undo the last step<\/span><span>\u2192<\/span><span>\u2026<\/span><span>\u2192<\/span><span>undo the first step<\/span><\/div><p class=\"idea\">When only the end of a story is known, walk it backwards: undo each step with its opposite, last step first.<\/p><div class=\"story concept\" id=\"story13\" tabindex=\"0\" aria-label=\"Undo it story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 342 150\" role=\"img\" aria-label=\"Mia&#x27;s stickers forwards\" style=\"max-width:496px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"52\" width=\"58\" height=\"40\" rx=\"8\" class=\"node q\"/><text x=\"39.0\" y=\"78\" class=\"nodev\" text-anchor=\"middle\">?<\/text><path d=\"M72 60 Q105.0 34 138 60\" class=\"fwd\"/><path d=\"M131 54 l7 6 l-9 2\" class=\"fwd\"/><text x=\"105.0\" y=\"30\" class=\"fwdt\" text-anchor=\"middle\">gives half away<\/text><rect x=\"142\" y=\"52\" width=\"58\" height=\"40\" rx=\"8\" class=\"node q\"/><text x=\"171.0\" y=\"78\" class=\"nodev\" text-anchor=\"middle\">?<\/text><path d=\"M204 60 Q237.0 34 270 60\" class=\"fwd\"/><path d=\"M263 54 l7 6 l-9 2\" class=\"fwd\"/><text x=\"237.0\" y=\"30\" class=\"fwdt\" text-anchor=\"middle\">gets 3<\/text><rect x=\"274\" y=\"52\" width=\"58\" height=\"40\" rx=\"8\" class=\"node hl\"/><text x=\"303.0\" y=\"78\" class=\"nodev\" text-anchor=\"middle\">10<\/text><\/svg><\/div><figcaption><p>Mia gives away half her stickers, then gets 3 more. Now she has 10.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which number in the story do we actually know?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 306 70\" role=\"img\" aria-label=\"tempting\" style=\"max-width:444px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"101\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"116.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2<\/text><text x=\"155.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"179\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"194.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">3<\/text><text x=\"233.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"257\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"272.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">8<\/text><line x1=\"6\" y1=\"60\" x2=\"300\" y2=\"12\" class=\"strike banned big\"/><\/svg><\/div><figcaption><p>Tempting: run the story forwards on 10. But 10 is the end, not the start.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why can&#x27;t the end go through the steps again?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 342 150\" role=\"img\" aria-label=\"undo the last step\" style=\"max-width:496px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"52\" width=\"58\" height=\"40\" rx=\"8\" class=\"node q\"/><text x=\"39.0\" y=\"78\" class=\"nodev\" text-anchor=\"middle\">?<\/text><path d=\"M72 60 Q105.0 34 138 60\" class=\"fwd\"/><path d=\"M131 54 l7 6 l-9 2\" class=\"fwd\"/><text x=\"105.0\" y=\"30\" class=\"fwdt\" text-anchor=\"middle\">gives half away<\/text><rect x=\"142\" y=\"52\" width=\"58\" height=\"40\" rx=\"8\" class=\"node hl\"/><text x=\"171.0\" y=\"78\" class=\"nodev\" text-anchor=\"middle\">7<\/text><path d=\"M204 60 Q237.0 34 270 60\" class=\"fwd\"/><path d=\"M263 54 l7 6 l-9 2\" class=\"fwd\"/><text x=\"237.0\" y=\"30\" class=\"fwdt\" text-anchor=\"middle\">gets 3<\/text><path d=\"M270 86 Q237.0 112 204 86\" class=\"bwd\"/><path d=\"M211 92 l-7 -6 l9 -2\" class=\"bwd\"/><text x=\"237.0\" y=\"128\" class=\"bwdt\" text-anchor=\"middle\">\u2212 3<\/text><rect x=\"274\" y=\"52\" width=\"58\" height=\"40\" rx=\"8\" class=\"node\"/><text x=\"303.0\" y=\"78\" class=\"nodev\" text-anchor=\"middle\">10<\/text><\/svg><\/div><figcaption><p>Undo the last step first. She got 3, so take 3 away: 7.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 342 150\" role=\"img\" aria-label=\"undo the first step\" style=\"max-width:496px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"52\" width=\"58\" height=\"40\" rx=\"8\" class=\"node hl\"/><text x=\"39.0\" y=\"78\" class=\"nodev\" text-anchor=\"middle\">14<\/text><path d=\"M72 60 Q105.0 34 138 60\" class=\"fwd\"/><path d=\"M131 54 l7 6 l-9 2\" class=\"fwd\"/><text x=\"105.0\" y=\"30\" class=\"fwdt\" text-anchor=\"middle\">gives half away<\/text><path d=\"M138 86 Q105.0 112 72 86\" class=\"bwd\"/><path d=\"M79 92 l-7 -6 l9 -2\" class=\"bwd\"/><text x=\"105.0\" y=\"128\" class=\"bwdt\" text-anchor=\"middle\">\u00d7 2<\/text><rect x=\"142\" y=\"52\" width=\"58\" height=\"40\" rx=\"8\" class=\"node\"/><text x=\"171.0\" y=\"78\" class=\"nodev\" text-anchor=\"middle\">7<\/text><path d=\"M204 60 Q237.0 34 270 60\" class=\"fwd\"/><path d=\"M263 54 l7 6 l-9 2\" class=\"fwd\"/><text x=\"237.0\" y=\"30\" class=\"fwdt\" text-anchor=\"middle\">gets 3<\/text><path d=\"M270 86 Q237.0 112 204 86\" class=\"bwd\"/><path d=\"M211 92 l-7 -6 l9 -2\" class=\"bwd\"/><text x=\"237.0\" y=\"128\" class=\"bwdt\" text-anchor=\"middle\">\u2212 3<\/text><rect x=\"274\" y=\"52\" width=\"58\" height=\"40\" rx=\"8\" class=\"node\"/><text x=\"303.0\" y=\"78\" class=\"nodev\" text-anchor=\"middle\">10<\/text><\/svg><\/div><figcaption><p>She gave away half and kept 7, so she had twice 7: 14.<\/p><div class=\"ask\"><b>Ask him:<\/b> What is the opposite of &#x27;gives away half&#x27;?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>forwards<\/th><th>stickers<\/th><\/tr><\/thead><tbody><tr><td>start<\/td><td>14<\/td><\/tr><tr><td>gives away half (7)<\/td><td>7<\/td><\/tr><tr><td>gets 3<\/td><td>10 \u2713<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Check by playing the story forwards from 14.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>the story did<\/th><th>undo it with<\/th><\/tr><\/thead><tbody><tr><td>+ 3<\/td><td>\u2212 3<\/td><\/tr><tr><td>\u00d7 2<\/td><td>\u00f7 2<\/td><\/tr><tr><td>gives away half<\/td><td>\u00d7 2<\/td><\/tr><tr><td>takes half, then 4 more<\/td><td>+ 4, then \u00d7 2<\/td><\/tr><tr><td>takes 5<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Every step has an opposite. Undo them in reverse order: last step first.<\/p><div class=\"ask\"><b>Ask him:<\/b> Fill in the last row.<\/div><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c2": "<h2>Bars and units<\/h2><div class=\"eq\" role=\"math\"><span>1 unit<\/span><span>=<\/span><span><span class=\"frac\"><span>known amount<\/span><span>number of units it covers<\/span><\/span><\/span><\/div><p class=\"idea\">Draw every amount as bars of the same size. Find what one bar is worth, then count bars.<\/p><div class=\"story concept\" id=\"story14\" tabindex=\"0\" aria-label=\"Bars and units story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 352 124\" role=\"img\" aria-label=\"Sue and Tom&#x27;s marbles\" style=\"max-width:510px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"62\" y=\"25.0\" class=\"barname\" text-anchor=\"end\">Sue<\/text><circle cx=\"82.0\" cy=\"20.0\" r=\"11.0\" class=\"ic blue ghost\"/><circle cx=\"112.0\" cy=\"20.0\" r=\"11.0\" class=\"ic blue ghost\"/><circle cx=\"142.0\" cy=\"20.0\" r=\"11.0\" class=\"ic blue ghost\"/><circle cx=\"172.0\" cy=\"20.0\" r=\"11.0\" class=\"ic blue ghost\"/><text x=\"198\" y=\"25.0\" class=\"op\" text-anchor=\"middle\">\u2026<\/text><text x=\"62\" y=\"71.0\" class=\"barname\" text-anchor=\"end\">Tom<\/text><circle cx=\"82.0\" cy=\"66.0\" r=\"11.0\" class=\"ic green ghost\"/><circle cx=\"112.0\" cy=\"66.0\" r=\"11.0\" class=\"ic green ghost\"/><circle cx=\"142.0\" cy=\"66.0\" r=\"11.0\" class=\"ic green ghost\"/><circle cx=\"172.0\" cy=\"66.0\" r=\"11.0\" class=\"ic green ghost\"/><text x=\"198\" y=\"71.0\" class=\"op\" text-anchor=\"middle\">\u2026<\/text><text x=\"220\" y=\"71.0\" class=\"barright\" text-anchor=\"start\">3 times Sue<\/text><text x=\"176.0\" y=\"118\" class=\"cap\" text-anchor=\"middle\">together: 56 marbles<\/text><\/svg><\/div><figcaption><p>Two people, one total.<\/p><div class=\"ask\"><b>Ask him:<\/b> Who has more?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 267 70\" role=\"img\" aria-label=\"tempting\" style=\"max-width:387px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">56<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"101\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"116.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">3<\/text><rect x=\"140\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"155.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">\u2248<\/text><rect x=\"179\" y=\"16\" width=\"70\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"214.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">18.7<\/text><line x1=\"6\" y1=\"60\" x2=\"261\" y2=\"12\" class=\"strike banned big\"/><\/svg><\/div><figcaption><p>Tempting: 56 \u00f7 3. That splits 56 into 3 parts, but Sue&#x27;s part was forgotten.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 392 202\" role=\"img\" aria-label=\"Sue 1 bar, Tom 3 bars\" style=\"max-width:568px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"62\" y=\"31\" class=\"barname\" text-anchor=\"end\">Sue<\/text><rect x=\"70\" y=\"10\" width=\"50\" height=\"30\" class=\"unit \"/><text x=\"128\" y=\"31\" class=\"barright\" text-anchor=\"start\">1 bar<\/text><text x=\"62\" y=\"93\" class=\"barname\" text-anchor=\"end\">Tom<\/text><rect x=\"70\" y=\"72\" width=\"50\" height=\"30\" class=\"unit \"/><rect x=\"120\" y=\"72\" width=\"50\" height=\"30\" class=\"unit \"/><rect x=\"170\" y=\"72\" width=\"50\" height=\"30\" class=\"unit \"/><text x=\"228\" y=\"93\" class=\"barright\" text-anchor=\"start\">3 bars<\/text><text x=\"62\" y=\"155\" class=\"barname\" text-anchor=\"end\">both<\/text><rect x=\"70\" y=\"134\" width=\"50\" height=\"30\" class=\"unit \"/><rect x=\"120\" y=\"134\" width=\"50\" height=\"30\" class=\"unit \"/><rect x=\"170\" y=\"134\" width=\"50\" height=\"30\" class=\"unit \"/><rect x=\"220\" y=\"134\" width=\"50\" height=\"30\" class=\"unit \"/><text x=\"278\" y=\"155\" class=\"barright\" text-anchor=\"start\">4 bars = 56<\/text><\/svg><\/div><figcaption><p>Sue is 1 bar. Tom is 3 bars of the same size. That&#x27;s 4 bars in all.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why must the bars be the same size?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 241 92\" role=\"img\" aria-label=\"one bar\" style=\"max-width:349px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">56<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"101\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"116.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4<\/text><text x=\"155.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"179\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"201.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">14<\/text><text x=\"120.5\" y=\"86\" class=\"cap\" text-anchor=\"middle\">Sue 14, Tom 3 \u00d7 14 = 42<\/text><\/svg><\/div><figcaption><p>One bar is 14. Tom is 3 bars: 42. Check: 14 + 42 = 56.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 509 78\" role=\"img\" aria-label=\"percent as 10 bars\" style=\"max-width:738px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"62\" y=\"31\" class=\"barname\" text-anchor=\"end\">$50<\/text><rect x=\"70\" y=\"10\" width=\"30\" height=\"30\" class=\"unit hl\"/><rect x=\"100\" y=\"10\" width=\"30\" height=\"30\" class=\"unit hl\"/><rect x=\"130\" y=\"10\" width=\"30\" height=\"30\" class=\"unit hl\"/><text x=\"115.0\" y=\"30\" class=\"unitlab\" text-anchor=\"middle\">30%<\/text><rect x=\"160\" y=\"10\" width=\"30\" height=\"30\" class=\"unit \"/><rect x=\"190\" y=\"10\" width=\"30\" height=\"30\" class=\"unit \"/><rect x=\"220\" y=\"10\" width=\"30\" height=\"30\" class=\"unit \"/><rect x=\"250\" y=\"10\" width=\"30\" height=\"30\" class=\"unit \"/><rect x=\"280\" y=\"10\" width=\"30\" height=\"30\" class=\"unit \"/><rect x=\"310\" y=\"10\" width=\"30\" height=\"30\" class=\"unit \"/><rect x=\"340\" y=\"10\" width=\"30\" height=\"30\" class=\"unit \"/><text x=\"378\" y=\"31\" class=\"barright\" text-anchor=\"start\">10 bars of $5<\/text><\/svg><\/div><figcaption><p>Percents are bars too: cut the whole into 10 bars of 10%. anchor=\"middle\">4<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"88\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"116.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2 m<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"192\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"220.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">8 m<\/text><\/svg><\/div><figcaption><p>4 gaps \u00d7 2 m = 8 m.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 520.0 96\" role=\"img\" aria-label=\"five lessons, four breaks\" style=\"max-width:754px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"20\" y=\"26\" width=\"82.75862068965517\" height=\"34\" class=\"tseg \"/><text x=\"61.37931034482759\" y=\"48\" class=\"segt\" text-anchor=\"middle\">lesson<\/text><rect x=\"102.75862068965517\" y=\"26\" width=\"16.551724137931036\" height=\"34\" class=\"tseg gap\"/><text x=\"111.0344827586207\" y=\"48\" class=\"segt\" text-anchor=\"middle\">break<\/text><rect x=\"119.3103448275862\" y=\"26\" width=\"82.75862068965517\" height=\"34\" class=\"tseg \"/><text x=\"160.68965517241378\" y=\"48\" class=\"segt\" text-anchor=\"middle\">lesson<\/text><rect x=\"202.0689655172414\" y=\"26\" width=\"16.551724137931036\" height=\"34\" class=\"tseg gap\"/><text x=\"210.34482758620692\" y=\"48\" class=\"segt\" text-anchor=\"middle\">break<\/text><rect x=\"218.62068965517244\" y=\"26\" width=\"82.75862068965517\" height=\"34\" class=\"tseg \"/><text x=\"260.0\" y=\"48\" class=\"segt\" text-anchor=\"middle\">lesson<\/text><rect x=\"301.3793103448276\" y=\"26\" width=\"16.551724137931036\" height=\"34\" class=\"tseg gap\"/><text x=\"309.65517241379314\" y=\"48\" class=\"segt\" text-anchor=\"middle\">break<\/text><rect x=\"317.93103448275866\" y=\"26\" width=\"82.75862068965517\" height=\"34\" class=\"tseg \"/><text x=\"359.3103448275863\" y=\"48\" class=\"segt\" text-anchor=\"middle\">lesson<\/text><rect x=\"400.68965517241384\" y=\"26\" width=\"16.551724137931036\" height=\"34\" class=\"tseg gap\"/><text x=\"408.96551724137936\" y=\"48\" class=\"segt\" text-anchor=\"middle\">break<\/text><rect x=\"417.2413793103449\" y=\"26\" width=\"82.75862068965517\" height=\"34\" class=\"tseg \"/><text x=\"458.62068965517244\" y=\"48\" class=\"segt\" text-anchor=\"middle\">lesson<\/text><\/svg><\/div><figcaption><p>Time works the same way: 5 lessons have 4 breaks between them.<\/p><div class=\"ask\"><b>Ask him:<\/b> How many breaks for 8 lessons?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>posts<\/th><th>gaps<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>1<\/td><\/tr><tr><td>5<\/td><td>4<\/td><\/tr><tr><td>7<\/td><td>6<\/td><\/tr><tr><td>12<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>In a line: gaps = posts \u2212 1. (Around a circle, gaps = posts.)<\/p><div class=\"ask\"><b>Ask him:<\/b> Fill in the last row.<\/div><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c6": "<h2>Same time block<\/h2><div class=\"eq\" role=\"math\"><span>time for one job<\/span><span>=<\/span><span><span class=\"frac\"><span>one shared block of time<\/span><span>jobs done in that block<\/span><\/span><\/span><\/div><p class=\"idea\">When things work at different speeds, pick one block of time they all fit into, count the jobs each does in it, then add (or subtract).<\/p><div class=\"story concept\" id=\"story18\" tabindex=\"0\" aria-label=\"Same time block story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 440 236\" role=\"img\" aria-label=\"a pool with two filling pipes\" style=\"max-width:638px\" preserveAspectRatio=\"xMidYMid meet\"><path d=\"M90 70 h240 v60 q0 30 -30 30 h-180 q-30 0 -30 -30 z\" class=\"tubbody\"/><rect x=\"94\" y=\"110\" width=\"232\" height=\"46\" rx=\"6\" class=\"water\"/><path d=\"M110 20 h60 v16 h-20 v14\" class=\"pipe\"/><path d=\"M150 52 v40\" class=\"flowin\"/><path d=\"M143 84 l7 10 l7 -10\" class=\"flowin\"/><text x=\"184\" y=\"34\" class=\"fwdt\" text-anchor=\"start\">A: 1 pool in 3 h \u00b7 B: 1 pool in 6 h<\/text><text x=\"220.0\" y=\"230\" class=\"cap\" text-anchor=\"middle\">both pipes fill \u00b7 no drain<\/text><\/svg><\/div><figcaption><p>Two workers, one job.<\/p><div class=\"ask\"><b>Ask him:<\/b> Faster or slower than 3 hours?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 345 70\" role=\"img\" aria-label=\"tempting\" style=\"max-width:500px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"64.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">(3 + 6)<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"166\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"181.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"244\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"285.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4.5 h<\/text><line x1=\"6\" y1=\"60\" x2=\"339\" y2=\"12\" class=\"strike banned big\"/><\/svg><\/div><figcaption><p>Tempting: average the times. But two pipes must be faster than the fast one alone.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 278 140\" role=\"img\" aria-label=\"pools in a 6-hour block\" style=\"max-width:403px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"62\" y=\"31\" class=\"barname\" text-anchor=\"end\">pipe A<\/text><rect x=\"70\" y=\"10\" width=\"60\" height=\"30\" class=\"unit hl\"/><rect x=\"130\" y=\"10\" width=\"60\" height=\"30\" class=\"unit hl\"/><text x=\"198\" y=\"31\" class=\"barright\" text-anchor=\"start\">2 pools<\/text><text x=\"62\" y=\"93\" class=\"barname\" text-anchor=\"end\">pipe B<\/text><rect x=\"70\" y=\"72\" width=\"60\" height=\"30\" class=\"unit hl\"/><text x=\"138\" y=\"93\" class=\"barright\" text-anchor=\"start\">1 pool<\/text><\/svg><\/div><figcaption><p>Pick a block both times fit into: 6 hours. A fills 2 pools, B fills 1.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why 6 hours?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 345 70\" role=\"img\" aria-label=\"one pool\" style=\"max-width:500px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"38.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">6 h<\/text><text x=\"90.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"114\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"168.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">3 pools<\/text><text x=\"246.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"270\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"298.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2 h<\/text><\/svg><\/div><figcaption><p>Together: 3 pools per 6 hours, so 1 pool in 2 hours.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 312 140\" role=\"img\" aria-label=\"working against each other\" style=\"max-width:452px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"62\" y=\"31\" class=\"barname\" text-anchor=\"end\">fill<\/text><rect x=\"70\" y=\"10\" width=\"60\" height=\"30\" class=\"unit hl\"/><rect x=\"130\" y=\"10\" width=\"60\" height=\"30\" class=\"unit hl\"/><rect x=\"190\" y=\"10\" width=\"60\" height=\"30\" class=\"unit hl\"/><text x=\"258\" y=\"31\" class=\"barright\" text-anchor=\"start\">3 in<\/text><text x=\"62\" y=\"93\" class=\"barname\" text-anchor=\"end\">leak<\/text><rect x=\"70\" y=\"72\" width=\"60\" height=\"30\" class=\"unit give\"/><text x=\"138\" y=\"93\" class=\"barright\" text-anchor=\"start\">1 out<\/text><\/svg><\/div><figcaption><p>If one works against the other (a leak), subtract instead: 3 \u2212 1 = 2 jobs per block.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>A alone<\/th><th>B alone<\/th><th>block<\/th><th>jobs together<\/th><th>time<\/th><\/tr><\/thead><tbody><tr><td>3 h<\/td><td>6 h<\/td><td>6 h<\/td><td>3<\/td><td>2 h<\/td><\/tr><tr><td>4 h<\/td><td>12 h<\/td><td>12 h<\/td><td>4<\/td><td>3 h<\/td><\/tr><tr><td>2 h<\/td><td>6 h<\/td><td>6 h<\/td><td>4<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Time for one job = block \u00f7 jobs in the block.<\/p><div class=\"ask\"><b>Ask him:<\/b> Fill in the last row.<\/div><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c7": "<h2>Draw the shape<\/h2><div class=\"eq\" role=\"math\"><span>inside length<\/span><span>=<\/span><span>outside length<\/span><span>\u2212<\/span><span>both borders<\/span><\/div><p class=\"idea\">Draw the shape to scale-ish and write every length on it. Borders and setbacks come off both ends.<\/p><div class=\"story conc
