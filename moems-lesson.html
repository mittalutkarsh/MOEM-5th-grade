\/text><line x1=\"6\" y1=\"60\" x2=\"235\" y2=\"12\" class=\"strike banned big\"/><\/svg><\/div><figcaption><p>Tempting: take 2 off each length once: 13 \u00d7 7. But the path is on both ends.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 422 290\" role=\"img\" aria-label=\"lawn inside the path\" style=\"max-width:612px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"46\" y=\"46\" width=\"330\" height=\"198\" class=\"lotr\"/><rect x=\"90\" y=\"90\" width=\"242\" height=\"110\" class=\"house\"/><line x1=\"46\" y1=\"145.0\" x2=\"90\" y2=\"145.0\" class=\"dim\"/><circle cx=\"46\" cy=\"145.0\" r=\"2.5\" class=\"dimend\"/><circle cx=\"90\" cy=\"145.0\" r=\"2.5\" class=\"dimend\"/><rect x=\"58.8\" y=\"135.0\" width=\"18.4\" height=\"18\" class=\"dimbg\"/><text x=\"68.0\" y=\"149.0\" class=\"dimt\" text-anchor=\"middle\">2<\/text><line x1=\"332\" y1=\"145.0\" x2=\"376\" y2=\"145.0\" class=\"dim\"/><circle cx=\"332\" cy=\"145.0\" r=\"2.5\" class=\"dimend\"/><circle cx=\"376\" cy=\"145.0\" r=\"2.5\" class=\"dimend\"/><rect x=\"344.8\" y=\"135.0\" width=\"18.4\" height=\"18\" class=\"dimbg\"/><text x=\"354.0\" y=\"149.0\" class=\"dimt\" text-anchor=\"middle\">2<\/text><line x1=\"211.0\" y1=\"46\" x2=\"211.0\" y2=\"90\" class=\"dim\"/><circle cx=\"211.0\" cy=\"46\" r=\"2.5\" class=\"dimend\"/><circle cx=\"211.0\" cy=\"90\" r=\"2.5\" class=\"dimend\"/><rect x=\"201.8\" y=\"59.0\" width=\"18.4\" height=\"18\" class=\"dimbg\"/><text x=\"211.0\" y=\"73.0\" class=\"dimt\" text-anchor=\"middle\">2<\/text><line x1=\"211.0\" y1=\"200\" x2=\"211.0\" y2=\"244\" class=\"dim\"/><circle cx=\"211.0\" cy=\"200\" r=\"2.5\" class=\"dimend\"/><circle cx=\"211.0\" cy=\"244\" r=\"2.5\" class=\"dimend\"/><rect x=\"201.8\" y=\"213.0\" width=\"18.4\" height=\"18\" class=\"dimbg\"/><text x=\"211.0\" y=\"227.0\" class=\"dimt\" text-anchor=\"middle\">2<\/text><\/svg><\/div><figcaption><p>Draw it: 2 m comes off the left AND the right, the top AND the bottom.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 241 70\" role=\"img\" aria-label=\"lawn\" style=\"max-width:349px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">11<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"101\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"116.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5<\/text><text x=\"155.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"179\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"201.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">55<\/text><\/svg><\/div><figcaption><p>Lawn: 15 \u2212 4 = 11 by 9 \u2212 4 = 5, so 55 sq m.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 462 42\" role=\"img\" aria-label=\"a 2-long piece in a 5-long row: four starting places\" style=\"max-width:670px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"106\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"61.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">cells 1\u20132<\/text><rect x=\"120\" y=\"6\" width=\"106\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"173.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">cells 2\u20133<\/text><rect x=\"232\" y=\"6\" width=\"106\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"285.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">cells 3\u20134<\/text><rect x=\"344\" y=\"6\" width=\"106\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"397.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">cells 4\u20135<\/text><\/svg><\/div><figcaption><p>In 3-D or 1-D, slide a piece along the row: a 2-long piece fits at 4 starting places in a 5-long row.<\/p><div class=\"ask\"><b>Ask him:<\/b> How many in a 3-long row?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>outside<\/th><th>border<\/th><th>inside<\/th><\/tr><\/thead><tbody><tr><td>15<\/td><td>2<\/td><td>11<\/td><\/tr><tr><td>9<\/td><td>2<\/td><td>5<\/td><\/tr><tr><td>20<\/td><td>3<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Inside = outside \u2212 2 \u00d7 border.<\/p><div class=\"ask\"><b>Ask him:<\/b> Fill in the last row.<\/div><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c8": "<h2>Worst case<\/h2><div class=\"eq\" role=\"math\"><span>guarantee<\/span><span>=<\/span><span>(most you can have without it)<\/span><span>+<\/span><span>1<\/span><\/div><p class=\"idea\">&#x27;Guarantee&#x27; means even the unluckiest run works. Build the unluckiest run on purpose, then add one.<\/p><div class=\"story concept\" id=\"story20\" tabindex=\"0\" aria-label=\"Worst case story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 360 124\" role=\"img\" aria-label=\"a drawer of red and blue socks\" style=\"max-width:522px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"62\" y=\"25.0\" class=\"barname\" text-anchor=\"end\">red<\/text><circle cx=\"82.0\" cy=\"20.0\" r=\"11.0\" class=\"ic red ghost\"/><circle cx=\"112.0\" cy=\"20.0\" r=\"11.0\" class=\"ic red ghost\"/><circle cx=\"142.0\" cy=\"20.0\" r=\"11.0\" class=\"ic red ghost\"/><circle cx=\"172.0\" cy=\"20.0\" r=\"11.0\" class=\"ic red ghost\"/><text x=\"198\" y=\"25.0\" class=\"op\" text-anchor=\"middle\">\u2026<\/text><text x=\"62\" y=\"71.0\" class=\"barname\" text-anchor=\"end\">blue<\/text><circle cx=\"82.0\" cy=\"66.0\" r=\"11.0\" class=\"ic blue ghost\"/><circle cx=\"112.0\" cy=\"66.0\" r=\"11.0\" class=\"ic blue ghost\"/><circle cx=\"142.0\" cy=\"66.0\" r=\"11.0\" class=\"ic blue ghost\"/><circle cx=\"172.0\" cy=\"66.0\" r=\"11.0\" class=\"ic blue ghost\"/><text x=\"198\" y=\"71.0\" class=\"op\" text-anchor=\"middle\">\u2026<\/text><text x=\"180.0\" y=\"118\" class=\"cap\" text-anchor=\"middle\">a dark drawer \u00b7 pull without looking \u00b7 want a pair<\/text><\/svg><\/div><figcaption><p>Two colours, no looking.<\/p><div class=\"ask\"><b>Ask him:<\/b> What would the unluckiest pull look like?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 150 70\" role=\"img\" aria-label=\"tempting\" style=\"max-width:218px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2<\/text><rect x=\"49\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"90.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">socks<\/text><line x1=\"6\" y1=\"60\" x2=\"144\" y2=\"12\" class=\"strike banned big\"/><\/svg><\/div><figcaption><p>Tempting: 2. That&#x27;s the lucky case. Two socks could be red and blue.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 88 56\" role=\"img\" aria-label=\"unluckiest: one of each\" style=\"max-width:128px\" preserveAspectRatio=\"xMidYMid meet\"><circle cx=\"26\" cy=\"26\" r=\"14\" class=\"ball red\"/><text x=\"26\" y=\"31\" class=\"ballt\" text-anchor=\"middle\">R<\/text><circle cx=\"60\" cy=\"26\" r=\"14\" class=\"ball blue\"/><text x=\"60\" y=\"31\" class=\"ballt\" text-anchor=\"middle\">B<\/text><\/svg><\/div><figcaption><p>The unluckiest pull: one of each colour, no pair.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 122 56\" role=\"img\" aria-label=\"the third sock\" style=\"max-width:177px\" preserveAspectRatio=\"xMidYMid meet\"><circle cx=\"26\" cy=\"26\" r=\"14\" class=\"ball red\"/><text x=\"26\" y=\"31\" class=\"ballt\" text-anchor=\"middle\">R<\/text><circle cx=\"60\" cy=\"26\" r=\"14\" class=\"ball blue\"/><text x=\"60\" y=\"31\" class=\"ballt\" text-anchor=\"middle\">B<\/text><circle cx=\"94\" cy=\"26\" r=\"14\" class=\"ball any next\"/><text x=\"94\" y=\"31\" class=\"ballt\" text-anchor=\"middle\">?<\/text><\/svg><\/div><figcaption><p>Sock 3 must match one of them: 3 socks guarantee a pair.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 156 56\" role=\"img\" aria-label=\"three colours\" style=\"max-width:226px\" preserveAspectRatio=\"xMidYMid meet\"><circle cx=\"26\" cy=\"26\" r=\"14\" class=\"ball red\"/><text x=\"26\" y=\"31\" class=\"ballt\" text-anchor=\"middle\">R<\/text><circle cx=\"60\" cy=\"26\" r=\"14\" class=\"ball blue\"/><text x=\"60\" y=\"31\" class=\"ballt\" text-anchor=\"middle\">B<\/text><circle cx=\"94\" cy=\"26\" r=\"14\" class=\"ball green\"/><text x=\"94\" y=\"31\" class=\"ballt\" text-anchor=\"middle\">G<\/text><circle cx=\"128\" cy=\"26\" r=\"14\" class=\"ball any next\"/><text x=\"128\" y=\"31\" class=\"ballt\" text-anchor=\"middle\">?<\/text><\/svg><\/div><figcaption><p>Three colours: the unluckiest is one of each, so 4 guarantee a pair.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>colours<\/th><th>socks for a sure pair<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>4<\/td><\/tr><tr><td>7<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Guarantee = the unluckiest run + 1.<\/p><div class=\"ask\"><b>Ask him:<\/b> Fill in the last row.<\/div><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c9": "<h2>Friendly groups<\/h2><div class=\"eq\" role=\"math\"><span>a \u00d7 b<\/span><span>+<\/span><span>a \u00d7 c<\/span><span>=<\/span><span>a \u00d7 (b + c)<\/span><span>&nbsp;&nbsp;<\/span><span>and<\/span><span>&nbsp;&nbsp;<\/span><span>pair up to 10, 100, 1000<\/span><\/div><p class=\"idea\">Before calculating a long sum or product, look for numbers that make 10, 100 or 1000 together, or a number that repeats. Regroup first, then calculate.<\/p><div class=\"story concept\" id=\"story21\" tabindex=\"0\" aria-label=\"Friendly groups story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 300 56\" role=\"img\" aria-label=\"a sum\" style=\"max-width:435px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"292\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"150.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">37 + 58 + 63 + 42<\/text><\/svg><\/div><figcaption><p>A plain-looking sum.<\/p><div class=\"ask\"><b>Ask him:<\/b> Do any two of these make a round number?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 371 70\" role=\"img\" aria-label=\"tempting\" style=\"max-width:538px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"239\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"129.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">37 + 58 + 63 + 42<\/text><text x=\"272.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"296\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"324.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">190<\/text><line x1=\"6\" y1=\"60\" x2=\"365\" y2=\"12\" class=\"strike banned big\"/><\/svg><\/div><figcaption><p>Adding left to right piles up carries, and one dropped carry gives 190.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 527 70\" role=\"img\" aria-label=\"paired\" style=\"max-width:764px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"135\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"77.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">(37 + 63)<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"192\" y=\"16\" width=\"135\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"259.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">(58 + 42)<\/text><text x=\"350.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"374\" y=\"16\" width=\"135\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"441.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">100 + 100<\/text><\/svg><\/div><figcaption><p>Pair the friends: 37 with 63, 58 with 42. Each pair makes 100.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 423 70\" role=\"img\" aria-label=\"same number\" style=\"max-width:613px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"58.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">13 \u00d7 7<\/text><text x=\"129.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"153\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"201.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">13 \u00d7 3<\/text><text x=\"272.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"296\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"350.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">13 \u00d7 10<\/text><\/svg><\/div><figcaption><p>A number that repeats: 13 seven times and 13 three more times is 13 ten times: 130.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 220 222\" role=\"img\" aria-label=\"every column holds 1, 2, 3, 4\" style=\"max-width:319px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"170.0\" y=\"6\" width=\"30\" height=\"202\" rx=\"6\" class=\"colhl\"/><text x=\"185.0\" y=\"52\" class=\"digit\" text-anchor=\"middle\">1<\/text><text x=\"155.0\" y=\"52\" class=\"digit\" text-anchor=\"middle\">2<\/text><text x=\"125.0\" y=\"52\" class=\"digit\" text-anchor=\"middle\">3<\/text><text x=\"95.0\" y=\"52\" class=\"digit\" text-anchor=\"middle\">4<\/text><text x=\"185.0\" y=\"84\" class=\"digit\" text-anchor=\"middle\">4<\/text><text x=\"155.0\" y=\"84\" class=\"digit\" text-anchor=\"middle\">1<\/text><text x=\"125.0\" y=\"84\" class=\"digit\" text-anchor=\"middle\">2<\/text><text x=\"95.0\" y=\"84\" class=\"digit\" text-anchor=\"middle\">3<\/text><text x=\"185.0\" y=\"116\" class=\"digit\" text-anchor=\"middle\">3<\/text><text x=\"155.0\" y=\"116\" class=\"digit\" text-anchor=\"middle\">4<\/text><text x=\"125.0\" y=\"116\" class=\"digit\" text-anchor=\"middle\">1<\/text><text x=\"95.0\" y=\"116\" class=\"digit\" text-anchor=\"middle\">2<\/text><text x=\"35.0\" y=\"148\" class=\"op\" text-anchor=\"middle\">+<\/text><text x=\"185.0\" y=\"148\" class=\"digit\" text-anchor=\"middle\">2<\/text><text x=\"155.0\" y=\"148\" class=\"digit\" text-anchor=\"middle\">3<\/text><text x=\"125.0\" y=\"148\" class=\"digit\" text-anchor=\"middle\">4<\/text><text x=\"95.0\" y=\"148\" class=\"digit\" text-anchor=\"middle\">1<\/text><line x1=\"14\" y1=\"160\" x2=\"206\" y2=\"160\" class=\"axis\"/><text x=\"185.0\" y=\"190\" class=\"digit res\" text-anchor=\"middle\">0<\/text><text x=\"155.0\" y=\"190\" class=\"digit res\" text-anchor=\"middle\">1<\/text><text x=\"125.0\" y=\"190\" class=\"digit res\" text-anchor=\"middle\">1<\/text><text x=\"95.0\" y=\"190\" class=\"digit res\" text-anchor=\"middle\">1<\/text><text x=\"65.0\" y=\"190\" class=\"digit res\" text-anchor=\"middle\">1<\/text><\/svg><\/div><figcaption><p>Columns: every column holds 1, 2, 3, 4, which add to 10. So the sum is 10 \u00d7 1111 = 11,110.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why does each column add to the same thing?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>number<\/th><th>its friend to 100<\/th><\/tr><\/thead><tbody><tr><td>37<\/td><td>63<\/td><\/tr><tr><td>58<\/td><td>42<\/td><\/tr><tr><td>71<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Look for friends first; calculate second.<\/p><div class=\"ask\"><b>Ask him:<\/b> Fill in the last row.<\/div><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c10": "<h2>Cycles and remainders<\/h2><div class=\"eq\" role=\"math\"><span>position<\/span><span>=<\/span><span>(full blocks) \u00d7 (block length)<\/span><span>+<\/span><span>remainder<\/span><\/div><p class=\"idea\">When something repeats, find one block. Throw away the full blocks; the remainder tells you where you land.<\/p><div class=\"story concept\" id=\"story22\" tabindex=\"0\" aria-label=\"Cycles and remainders story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 323 82\" role=\"img\" aria-label=\"days\" style=\"max-width:468px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"315\" height=\"74\" rx=\"10\" class=\"wcard \"/><text x=\"161.5\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">Today is Monday.<\/text><text x=\"161.5\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">What day is it 100 days from now?<\/text><\/svg><\/div><figcaption><p>Counting 100 days one by one would take forever.<\/p><div class=\"ask\"><b>Ask him:<\/b> What repeats?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 336 42\" role=\"img\" aria-label=\"the week repeats every 7 days\" style=\"max-width:487px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell hl\"/><text x=\"28.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Mon<\/text><rect x=\"54\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"74.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Tue<\/text><rect x=\"100\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"120.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Wed<\/text><rect x=\"146\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"166.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Thu<\/text><rect x=\"192\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"212.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Fri<\/text><rect x=\"238\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"258.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Sat<\/text><rect x=\"284\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"304.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Sun<\/text><\/svg><\/div><figcaption><p>Days repeat in blocks of 7.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 306 70\" role=\"img\" aria-label=\"blocks\" style=\"max-width:444px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"38.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">100<\/text><text x=\"90.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"114\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"129.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">7<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"192\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"240.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">14 r 2<\/text><\/svg><\/div><figcaption><p>14 full weeks bring us back to Monday. Then 2 more days.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 336 42\" role=\"img\" aria-label=\"two days after Monday\" style=\"max-width:487px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"28.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Mon<\/text><rect x=\"54\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"74.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Tue<\/text><rect x=\"100\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell hl\"/><text x=\"120.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Wed<\/text><rect x=\"146\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"166.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Thu<\/text><rect x=\"192\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"212.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Fri<\/text><rect x=\"238\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"258.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Sat<\/text><rect x=\"284\" y=\"6\" width=\"40\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"304.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">Sun<\/text><\/svg><\/div><figcaption><p>Two days after Monday: Wednesday.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 293 70\" role=\"img\" aria-label=\"tempting\" style=\"max-width:425px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"122\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"71.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">14 weeks<\/text><text x=\"155.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"179\" y=\"16\" width=\"96\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"227.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">Monday<\/text><line x1=\"6\" y1=\"60\" x2=\"287\" y2=\"12\" class=\"strike banned big\"/><\/svg><\/div><figcaption><p>Tempting: use the 14 (the full blocks). The full blocks don&#x27;t move you; the remainder does.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 262 42\" role=\"img\" aria-label=\"powers of 9: last digits 9, 1, 9, 1\" style=\"max-width:380px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"36.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">9<\/text><rect x=\"70\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"98.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">81<\/text><rect x=\"132\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"160.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">729<\/text><rect x=\"194\" y=\"6\" width=\"56\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"222.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">6561<\/text><\/svg><\/div><figcaption><p>Last digits repeat too: 9, 1, 9, 1, \u2026 So 9 times itself 7 times ends in 9 (7 is odd).<\/p><div class=\"ask\"><b>Ask him:<\/b> What would 9 times itself 10 times end in?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>days ahead<\/th><th>remainder (\u00f7 7)<\/th><th>day<\/th><\/tr><\/thead><tbody><tr><td>9<\/td><td>2<\/td><td>Wed<\/td><\/tr><tr><td>15<\/td><td>1<\/td><td>Tue<\/td><\/tr><tr><td>30<\/td><td>?<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Day = start + remainder.<\/p><div class=\"ask\"><b>Ask him:<\/b> Fill in the last row.<\/div><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c11": "<h2>Digit detective<\/h2><div class=\"eq\" role=\"math\"><span>number<\/span><span>=<\/span><span>1000s + 100s + 10s + 1s<\/span><span>&nbsp;&nbsp;<\/span><span>ones column first<\/span><\/div><p class=\"idea\">Puzzles about digits are solved column by column, starting with the ones, carrying as you go. Divisibility rules let you test a digit without dividing.<\/p><div class=\"story concept\" id=\"story23\" tabindex=\"0\" aria-label=\"Digit detective story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 160 158\" role=\"img\" aria-label=\"AA + AA = 1B2\" style=\"max-width:232px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"125.0\" y=\"52\" class=\"digit\" text-anchor=\"middle\">A<\/text><text x=\"95.0\" y=\"52\" class=\"digit\" text-anchor=\"middle\">A<\/text><text x=\"35.0\" y=\"84\" class=\"op\" text-anchor=\"middle\">+<\/text><text x=\"125.0\" y=\"84\" class=\"digit\" text-anchor=\"middle\">A<\/text><text x=\"95.0\" y=\"84\" class=\"digit\" text-anchor=\"middle\">A<\/text><line x1=\"14\" y1=\"96\" x2=\"146\" y2=\"96\" class=\"axis\"/><text x=\"125.0\" y=\"126\" class=\"digit res\" text-anchor=\"middle\">2<\/text><text x=\"95.0\" y=\"126\" class=\"digit res\" text-anchor=\"middle\">B<\/text><text x=\"65.0\" y=\"126\" class=\"digit res\" text-anchor=\"middle\">1<\/text><\/svg><\/div><figcaption><p>Each letter is one digit. AA + AA = 1B2.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which column should we look at first?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 160 158\" role=\"img\" aria-label=\"ones column\" style=\"max-width:232px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"110.0\" y=\"6\" width=\"30\" height=\"138\" rx=\"6\" class=\"colhl\"/><text x=\"125.0\" y=\"52\" class=\"digit\" text-anchor=\"middle\">A<\/text><text x=\"95.0\" y=\"52\" class=\"digit\" text-anchor=\"middle\">A<\/text><text x=\"35.0\" y=\"84\" class=\"op\" text-anchor=\"middle\">+<\/text><text x=\"125.0\" y=\"84\" class=\"digit\" text-anchor=\"middle\">A<\/text><text x=\"95.0\" y=\"84\" class=\"digit\" text-anchor=\"middle\">A<\/text><line x1=\"14\" y1=\"96\" x2=\"146\" y2=\"96\" class=\"axis\"/><text x=\"125.0\" y=\"126\" class=\"digit res\" text-anchor=\"middle\">2<\/text><text x=\"95.0\" y=\"126\" class=\"digit res\" text-anchor=\"middle\">B<\/text><text x=\"65.0\" y=\"126\" class=\"digit res\" text-anchor=\"middle\">1<\/text><\/svg><\/div><figcaption><p>Ones column: A + A ends in 2. So A is 1 or 6.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 228 70\" role=\"img\" aria-label=\"A = 1\" style=\"max-width:331px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"64.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">11 + 11<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"166\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"188.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">22<\/text><line x1=\"6\" y1=\"60\" x2=\"222\" y2=\"12\" class=\"strike banned big\"/><\/svg><\/div><figcaption><p>A = 1 gives 22: not a three-digit 1B2.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 160 158\" role=\"img\" aria-label=\"A = 6\" style=\"max-width:232px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"80.0\" y=\"6\" width=\"30\" height=\"138\" rx=\"6\" class=\"colhl\"/><text x=\"95.0\" y=\"22\" class=\"carry\" text-anchor=\"middle\">1<\/text><text x=\"125.0\" y=\"52\" class=\"digit\" text-anchor=\"middle\">6<\/text><text x=\"95.0\" y=\"52\" class=\"digit\" text-anchor=\"middle\">6<\/text><text x=\"35.0\" y=\"84\" class=\"op\" text-anchor=\"middle\">+<\/text><text x=\"125.0\" y=\"84\" class=\"digit\" text-anchor=\"middle\">6<\/text><text x=\"95.0\" y=\"84\" class=\"digit\" text-anchor=\"middle\">6<\/text><line x1=\"14\" y1=\"96\" x2=\"146\" y2=\"96\" class=\"axis\"/><text x=\"125.0\" y=\"126\" class=\"digit res\" text-anchor=\"middle\">2<\/text><text x=\"95.0\" y=\"126\" class=\"digit res\" text-anchor=\"middle\">3<\/text><text x=\"65.0\" y=\"126\" class=\"digit res\" text-anchor=\"middle\">1<\/text><\/svg><\/div><figcaption><p>A = 6: 66 + 66 = 132, so B = 3. Check the carry into the tens.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>divisible by<\/th><th>test<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>last digit even<\/td><\/tr><tr><td>3 or 9<\/td><td>digit sum divisible by 3 or 9<\/td><\/tr><tr><td>5<\/td><td>last digit 0 or 5<\/td><\/tr><tr><td>8<\/td><td>last three digits divisible by 8<\/td><\/tr><tr><td>11<\/td><td>alternate +, \u2212 digit sum divisible by 11<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The tests: no long division needed. 5,382 has digit sum 18, so 9 divides it.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>number<\/th><th>digit sum<\/th><th>divisible by 9?<\/th><\/tr><\/thead><tbody><tr><td>5,382<\/td><td>18<\/td><td>yes<\/td><\/tr><tr><td>7,215<\/td><td>15<\/td><td>no<\/td><\/tr><tr><td>2,601<\/td><td>?<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Digits tell you a lot.<\/p><div class=\"ask\"><b>Ask him:<\/b> Fill in the last row.<\/div><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c12": "<h2>Odd and even<\/h2><div class=\"eq\" role=\"math\"><span>odd + odd<\/span><span>=<\/span><span>even<\/span><span>,<\/span><span>odd + even<\/span><span>=<\/span><span>odd<\/span><span>,<\/span><span>an odd count of odd numbers<\/span><span>\u2192<\/span><span>odd sum<\/span><\/div><p class=\"idea\">Whether a total is odd or even depends only on how many odd numbers go into it. That one fact can rule out half the possible answers.<\/p><div class=\"story concept\" id=\"story24\" tabindex=\"0\" aria-label=\"Odd and even story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 332 56\" role=\"img\" aria-label=\"question\" style=\"max-width:481px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"324\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"166.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">Can five odd numbers add up to 20?<\/text><\/svg><\/div><figcaption><p>Try a few and see.<\/p><div class=\"ask\"><b>Ask him:<\/b> What do you notice?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 371 70\" role=\"img\" aria-label=\"try one\" style=\"max-width:538px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"252\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"136.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">1 + 5 + 7 + 9 + 11<\/text><text x=\"285.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"309\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"331.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">33<\/text><\/svg><\/div><figcaption><p>One try gives 33: odd.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>odd numbers added<\/th><th>sum is<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>odd<\/td><\/tr><tr><td>2<\/td><td>even<\/td><\/tr><tr><td>3<\/td><td>odd<\/td><\/tr><tr><td>5<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Pairs of odd numbers make even. One odd left over makes the sum odd.<\/p><div class=\"ask\"><b>Ask him:<\/b> Fill in the last row.<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 358 70\" role=\"img\" aria-label=\"ruled out\" style=\"max-width:519px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"135\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"77.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">five odds<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"192\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"220.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">odd<\/text><rect x=\"257\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"272.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">\u2260<\/text><rect x=\"296\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"318.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">20<\/text><\/svg><\/div><figcaption><p>Five odd numbers always add to an odd number, so never 20. No searching needed.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>race<\/th><th>points Beth can get<\/th><\/tr><\/thead><tbody><tr><td>each race<\/td><td>5, 3 or 1: odd<\/td><\/tr><tr><td>three races<\/td><td>odd + odd + odd = odd<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Contest use: three odd race scores give an odd total, so an even total is impossible.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>"}}</script>

<script>
/* Answer checker. Parses numbers and expressions exactly (BigInt rationals), so 2^5*20*49*47*46,
   11!/(4!4!2!), 3×2⁹, 10 choose 3, C(10,3), 10C3 and "1,260" all work. */
window.CHECK = (function () {
  "use strict";
  function gcd(a, b) { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { [a, b] = [b, a % b]; } return a; }
  function R(n, d) { d = d === undefined ? 1n : d; if (d === 0n) throw new Error("divide by zero"); if (d < 0n) { n = -n; d = -d; } const g = gcd(n, d) || 1n; return { n: n / g, d: d / g }; }
  const add = (a, b) => R(a.n * b.d + b.n * a.d, a.d * b.d);
  const sub = (a, b) => R(a.n * b.d - b.n * a.d, a.d * b.d);
  const mul = (a, b) => R(a.n * b.n, a.d * b.d);
  const div = (a, b) => R(a.n * b.d, a.d * b.n);
  const isInt = (a) => a.d === 1n;
  function fact(a) { if (!isInt(a) || a.n < 0n || a.n > 300n) throw new Error("factorial"); let r = 1n; for (let i = 2n; i <= a.n; i++) r *= i; return R(r); }
  function pow(a, b) {
    if (!isInt(b) || b.n < 0n || b.n > 2000n) throw new Error("power");
    let r = 1n, rd = 1n; for (let i = 0n; i < b.n; i++) { r *= a.n; rd *= a.d; } return R(r, rd);
  }
  function choose(n, k) {
    if (!isInt(n) || !isInt(k) || k.n < 0n || n.n < 0n) throw new Error("choose");
    if (k.n > n.n) return R(0n);
    return div(fact(n), mul(fact(k), fact(R(n.n - k.n))));
  }

  const SUP = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9" };
  const UNITS = /\s*([a-z][a-z\s.'’²³-]*)$/;
  function normalize(s) {
    s = String(s).trim().toLowerCase();
    s = s.replace(/[\u2212\u2013\u2014]/g, "-");
    s = s.replace(/[×✕✖·⋅∙•]/g, "*").replace(/÷/g, "/");
    s = s.replace(/\s*(cm|in|m|ft|units?|mm|km)[²³]/g, "");
    s = s.replace(/^(.*\d.*?)\s*\([^)]*[a-z][^)]*\)\s*$/, "$1");
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, (m) => "^" + [...m].map((c) => SUP[c]).join(""));
    s = s.replace(/^(about|abt\.?)\s+/, "");
    s = s.replace(/[$¢%°]/g, "").replace(/\bsq\.?\s*(ft|m|in|units?)\b/g, "");
    if (/\d/.test(s) && !/choose|c\s*\d/.test(s)) s = s.replace(UNITS, "");
    s = s.replace(/(\d+)\s+(\d+)\s*\/\s*(\d+)/g, "($1+$2/$3)");    // mixed number 2 1/2
    s = s.replace(/½/g, "+1/2").replace(/^\+/, "");
    s = s.replace(/^[a-z]\s*=\s*/, "");          // "n = 13"
    s = s.replace(/(\d),(?=\d{3}(?!\d))/g, "$1");  // thousands commas
    s = s.replace(/(\d)\s+(?=\d{3}(?!\d))/g, "$1"); // "67 800 320"
    s = s.replace(/(\d+)\s*choose\s*(\d+)/g, "c($1,$2)");
    s = s.replace(/(\d+)\s*c\s*(\d+)/g, "c($1,$2)");
    s = s.replace(/(\d|\))\s*x\s*(?=[\d(c])/g, "$1*");
    return s;
  }
  function tokenize(s) {
    const t = []; let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (/[0-9.]/.test(ch)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; t.push({ k: "num", v: s.slice(i, j) }); i = j; continue; }
      if (ch === "c" && s[i + 1] === "(") { t.push({ k: "C" }); i++; continue; }
      if ("+-*/^!(),".includes(ch)) { t.push({ k: ch }); i++; continue; }
      throw new Error("bad char " + ch);
    }
    return t;
  }
  function parseNum(v) {
    if ((v.match(/\./g) || []).length > 1) throw new Error("num");
    if (v.includes(".")) { const [a, b] = v.split("."); return R(BigInt((a || "0") + b), 10n ** BigInt(b.length)); }
    return R(BigInt(v));
  }
  function evaluate(src) {
    const t = tokenize(normalize(src)); let p = 0;
    const peek = () => t[p], eat = (k) => { if (!t[p] || t[p].k !== k) throw new Error("expected " + k); return t[p++]; };
    let ops = 0;
    function expr() { let a = term(); while (peek() && (peek().k === "+" || peek().k === "-")) { const o = t[p++].k; ops++; const b = term(); a = o === "+" ? add(a, b) : sub(a, b); } return a; }
    function startsFactor(tk) { return tk && (tk.k === "num" || tk.k === "(" || tk.k === "C"); }
    function term() {
      let a = power();
      for (;;) {
        const tk = peek();
        if (tk && (tk.k === "*" || tk.k === "/")) { p++; ops++; const b = power(); a = tk.k === "*" ? mul(a, b) : div(a, b); }
        else if (startsFactor(tk)) { ops++; a = mul(a, power()); }
        else break;
      }
      return a;
    }
    function power() { const a = unary(); if (peek() && peek().k === "^") { p++; ops++; return pow(a, power()); } return a; }
    function unary() { if (peek() && peek().k === "-") { p++; return sub(R(0n), unary()); } return post(); }
    function post() { let a = prim(); while (peek() && peek().k === "!") { p++; ops++; a = fact(a); } return a; }
    function prim() {
      const tk = peek(); if (!tk) throw new Error("end");
      if (tk.k === "num") { p++; return parseNum(tk.v); }
      if (tk.k === "(") { p++; const a = expr(); eat(")"); return a; }
      if (tk.k === "C") { p++; eat("("); const n = expr(); eat(","); const k = expr(); eat(")"); ops++; return choose(n, k); }
      throw new Error("unexpected " + tk.k);
    }
    const v = expr(); if (p !== t.length) throw new Error("trailing");
    return { v, ops };
  }
  function tryEval(s) { try { return evaluate(s); } catch (e) { return null; } }
  const show = (r) => (r.d === 1n ? r.n.toLocaleString("en-US") : r.n + "/" + r.d);
  const big = (x) => R(BigInt(x));
  function splitList(s) {
    let n = normalize(s).replace(/[()]/g, " ").replace(/\band\b|&|;/g, ",");
    const parts = n.split(/\s*,\s*|\s+/).filter(Boolean);
    return parts;
  }

  /* grade(step, input, others) -> {ok, msg, kind, value} ; others = answers of the problem's other steps (by number) */
  function grade(step, input, others) {
    others = others || [];
    const raw = String(input || "").trim();
    if (!raw) return { ok: false, kind: "empty", msg: "Type an answer first." };
    const type = step.type;
    if (type === "yn") {
      const y = /^(y|yes|true)$/i.test(raw), n = /^(n|no|false)$/i.test(raw);
      if (!y && !n) return { ok: false, kind: "unread", msg: "Answer yes or no." };
      return y === !!step.ans ? { ok: true } : { ok: false, kind: "wrong", msg: "Not quite. Look at the question again." };
    }
    if (type === "choice") {
      const want = String(step.ans).toLowerCase();
      const opts = (step.options || []).map((o) => o.toLowerCase());
      const got = raw.toLowerCase().replace(/[().]/g, "").trim();
      const idx = opts.indexOf(got);
      const asLetter = idx >= 0 ? String.fromCharCode(97 + idx) : got;
      return asLetter === want || got === want ? { ok: true } : { ok: false, kind: "wrong", msg: "Not that one." };
    }
    if (type === "text") {
      const need = step.ans.map((w) => String(w).toLowerCase());
      const ok = need.every((w) => raw.toLowerCase().includes(w));
      return ok ? { ok: true } : { ok: false, kind: "wrong", msg: "Not that. Look at the question again." };
    }
    if (type === "nums") {
      const parts = splitList(raw), vals = [];
      for (const pt of parts) { const e = tryEval(pt); if (!e) return { ok: false, kind: "unread", msg: "I couldn't read that list. Try two numbers like “8 and 3”." }; vals.push(e.v); }
      const want = step.ans.map(big);
      const key = vals.map(show).join(",").replace(/,(?=\d{3})/g, "");
      if (step.named && step.named[vals.map((v) => v.n.toString()).join(",")]) return { ok: false, kind: "named", msg: step.named[vals.map((v) => v.n.toString()).join(",")] };
      if (vals.length !== want.length) return { ok: false, kind: "count", msg: `I expected ${want.length} numbers; you gave ${vals.length}.` };
      const eqv = (a, b) => a.n === b.n && a.d === b.d;
      if (step.order) {
        if (vals.every((v, i) => eqv(v, want[i]))) return { ok: true };
        const sortedSame = [...vals].map(show).sort().join() === [...want].map(show).sort().join();
        if (sortedSame) return { ok: false, kind: "order", msg: "Right numbers, wrong order." };
      } else {
        const a = vals.map(show).sort().join(), b = want.map(show).sort().join();
        if (a === b) return { ok: true };
      }
      const hits = vals.filter((v) => want.some((w) => eqv(v, w))).length;
      if (hits === want.length - 1) return { ok: false, kind: "oneoff", msg: "Right number of values, but one is off." };
      return { ok: false, kind: "wrong", msg: "Those aren't the values." };
    }
    // num / expr
    const e = tryEval(raw);
    if (!e) return { ok: false, kind: "unread", msg: "I couldn't read that. Try a number, or an expression like 12 × 11 ÷ 4." };
    const v = e.v, we = tryEval(String(step.ans)), want = we ? we.v : big(step.ans);
    if (type === "expr" && e.ops === 0) return { ok: false, kind: "form", msg: "This step wants an expression (with ×, ÷, ! or a power), not just the number." };
    if (v.n === want.n && v.d === want.d) return { ok: true, value: v };
    if (step.special === "ps17" && isInt(v) && v.n >= 6n && v.n <= 400n) {
      const n = v, s6 = choose(n, R(6n)), s3 = choose(n, R(3n)), six = mul(R(6n), s3);
      const cmp = s6.n < six.n ? "too few sets of 6 — try a bigger n" : "too many sets of 6 — try a smaller n";
      return { ok: false, kind: "named", value: v, msg: `For n = ${show(n)}: sets of 6 = ${show(s6)}, and 6 × sets of 3 = ${show(six)}. That's ${cmp}.` };
    }
    const key = v.d === 1n ? v.n.toString() : v.n + "/" + v.d;
    if (step.named && step.named[key]) return { ok: false, kind: "named", value: v, msg: step.named[key] };
    for (let i = 0; i < others.length; i++) {
      if (others[i] === null || others[i] === undefined || Array.isArray(others[i])) continue;
      const oe = tryEval(String(others[i])); if (!oe) continue; const o = oe.v;
      if (o.n === v.n && o.d === v.d) return { ok: false, kind: "otherstep", value: v, msg: `That's step ${i + 1}'s answer.` };
    }
    if (!isInt(v) && isInt(want)) return { ok: false, kind: "frac", value: v, msg: "The answer is a whole number. Is there a division that doesn't come out even?" };
    if (!isInt(v) || !isInt(want)) {
      const d = sub(v, want), big2 = (d.n < 0n ? -d.n : d.n) * 20n * want.d <= (want.n < 0n ? -want.n : want.n) * d.d;
      return { ok: false, kind: "wrong", value: v, msg: big2 ? "Very close. Recheck the arithmetic." : (d.n > 0n ? "Too big." : "Too small.") };
    }
    const diff = v.n > want.n ? v.n - want.n : want.n - v.n;
    const absw = want.n < 0n ? -want.n : want.n;
    const close = diff * 50n <= absw || (diff <= 2n && absw > 20n);
    if (close) return { ok: false, kind: "close", value: v, msg: "Very close. Recheck the arithmetic." };
    if (v.n > want.n) {
      const q = v.n / want.n;
      if (want.n > 0n && v.n % want.n === 0n && q > 1n && q <= 720n) return { ok: false, kind: "big", value: v, msg: "Too big. Did something get counted twice?" };
      return { ok: false, kind: "big", value: v, msg: "Too big." };
    }
    return { ok: false, kind: "small", value: v, msg: "Too small. Is a fact missing?" };
  }
  return { grade, evaluate: (s) => { const e = tryEval(s); return e ? show(e.v) : null; }, normalize };
})();

</script>
<script>
/* Step-through story: one picture per frame, Back/Next, progress dots, Show all, ←/→ when focused. */
window.STORY = (function () {
  "use strict";
  function setup(st) {
    if (st.dataset.ready) return;
    st.dataset.ready = "1";
    const frames = Array.from(st.querySelectorAll(":scope .frame"));
    const dots = st.querySelector(".dots"), back = st.querySelector("[data-act=back]"), next = st.querySelector("[data-act=next]");
    const all = st.querySelector("input.showall"), name = st.querySelector(".stepname");
    const marks = Array.from(st.querySelectorAll(".plan-side li[data-s], .plan-strip span[data-s]"));
    const skipped = new Set(frames.filter((f) => f.classList.contains("skip")).map((f) => f.dataset.step));
    marks.forEach((m) => m.classList.toggle("skipd", skipped.has(m.dataset.s)));
    let i = 0;
    const seen = new Set([0]);
    frames.forEach((f, k) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", "Picture " + (k + 1) + " of " + frames.length);
      b.addEventListener("click", () => go(k));
      dots.appendChild(b);
    });
    function go(k) { i = Math.max(0, Math.min(frames.length - 1, k)); seen.add(i); render(); }
    function render() {
      frames.forEach((f, k) => f.classList.toggle("on", k === i));
      Array.from(dots.children).forEach((b, k) => { b.classList.toggle("on", k === i); b.classList.toggle("seen", seen.has(k) && k !== i); });
      back.disabled = i === 0;
      next.disabled = i === frames.length - 1;
      const s = frames[i] && frames[i].dataset.step;
      marks.forEach((m) => m.classList.toggle("on", s && m.dataset.s === s));
      if (name) name.textContent = s && st.dataset.plan ? JSON.parse(st.dataset.plan)[+s - 1] : "";
    }
    back.addEventListener("click", () => go(i - 1));
    next.addEventListener("click", () => go(i + 1));
    st.addEventListener("keydown", (e) => {
      if (e.target.closest("input,textarea,select")) return;
      if (e.key === "ArrowRight") { go(i + 1); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { go(i - 1); e.preventDefault(); }
    });
    all.addEventListener("change", () => st.classList.toggle("all", all.checked));
    st._go = go;
    render();
  }
  function init(root) { (root || document).querySelectorAll(".story").forEach(setup); }
  document.addEventListener("DOMContentLoaded", () => init());
  return { init };
})();

</script>
<script>
/* Workbench: problem rail, tabs, per-step grading loop, hint dialog, submit/reveal, timer, deep links.
   Nothing is stored between visits (no browser storage is used); ink is kept per problem in window.INK. */
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("bench-data").textContent);
  const P = DATA.problems, byId = {};
  P.forEach((p) => (byId[p.id] = p));
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ---- ink per problem ---- */
  const inkStore = {};
  window.INK = { get: (id) => inkStore[id] || [], set: (id, strokes) => { inkStore[id] = strokes; } };

  /* ---- state ---- */
  const S = {};
  P.forEach((p) => {
    S[p.id] = { time: 0, cur: 0, revealed: false, submitted: false, confirmArmed: 0,
      steps: p.steps.map(() => ({ tries: 0, misses: 0, state: "open", work: "", hints: 0, answers: [] })) };
  });
  let cur = null, tab = DATA.page === "lesson" ? "concept" : "problem", lastTick = Date.now();

  function status(id) {
    const s = S[id];
    if (s.revealed || s.steps.every((x) => x.state !== "open")) return "closed";
    if (s.steps.some((x) => x.tries || x.work.trim() || x.hints)) return "prog";
    return "untouched";
  }
  function finished() { return P.filter((p) => status(p.id) === "closed").length; }

  /* ---- console ---- */
  function log(msg, cls) {
    const c = $("console");
    const d = el("div", cls || "");
    const t = new Date();
    d.innerHTML = '<span class="ts">' + String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0") + "</span>" + msg;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
    if (cur) (S[cur].log = S[cur].log || []).push(d.outerHTML);
  }

  /* ---- top bar and rail ---- */
  function buildNav() {
    const sel = $("psel"), rail = $("rail");
    let lastSec = null, og = null;
    P.forEach((p) => {
      if (p.section !== lastSec) {
        og = el("optgroup"); og.label = p.section; sel.appendChild(og);
        rail.appendChild(el("h4", "", esc(p.section)));
        lastSec = p.section;
      }
      const o = el("option"); o.value = p.id; o.textContent = p.label; og.appendChild(o);
      const b = el("button", "", '<span class="sdot" aria-hidden="true"></span><span></span>');
      b.type = "button"; b.dataset.id = p.id; b.lastChild.textContent = p.label;
      b.setAttribute("aria-label", p.label);
      b.addEventListener("click", () => { select(p.id); rail.classList.remove("open"); });
      rail.appendChild(b);
    });
    sel.addEventListener("change", () => select(sel.value));
    $("prev").addEventListener("click", () => step(-1));
    $("next").addEventListener("click", () => step(1));
    $("railToggle").addEventListener("click", () => $("rail").classList.toggle("open"));
  }
  function step(d) { const i = P.findIndex((p) => p.id === cur); select(P[(i + d + P.length) % P.length].id); }
  function refreshNav() {
    $("psel").value = cur;
    document.querySelectorAll("#rail button[data-id]").forEach((b) => {
      b.classList.toggle("cur", b.dataset.id === cur);
      const st = status(b.dataset.id);
      b.firstChild.className = "sdot" + (st === "prog" ? " prog" : st === "closed" ? " closed" : "");
      b.setAttribute("aria-label", byId[b.dataset.id].label + " (" + (st === "untouched" ? "not started" : st === "prog" ? "in progress" : "finished") + ")");
    });
    $("finished").textContent = finished() + " / " + P.length + " finished";
  }

  /* ---- timer ---- */
  function tick() {
    const now = Date.now();
    if (cur && !document.hidden) S[cur].time += now - lastTick;
    lastTick = now;
    if (cur) { const s = Math.floor(S[cur].time / 1000); $("timer").textContent = "⏱ " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  }
  setInterval(tick, 1000);

  /* ---- tabs ---- */
  function setTab(t) {
    tab = t;
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    document.querySelectorAll(".tabpanel").forEach((pn) => (pn.hidden = pn.id !== "tab-" + t));
    if (t === "steps") renderMySteps();
  }

  /* ---- middle pane ---- */
  function renderProblem() {
    const p = byId[cur], s = S[cur], box = $("tab-problem");
    let h = '<h2>' + esc(p.label) + "</h2>";
    h += '<div class="ptext">' + esc(p.text) + (p.figure ? '<div class="pfig">' + p.figure + "</div>" : "") + "</div>";
    let meta = "";
    if (p.inclass) meta += '<span class="inclass" title="time in your class video">In class ' + esc(p.inclass) + "</span>";
    if (p.above) meta += '<span class="above">Above grade: split into steps</span>';
    if (meta) h += '<p class="pnote">' + meta + "</p>";
    if (p.note) h += '<p class="pnote">' + esc(p.note) + "</p>";
    const open = s.revealed || s.submitted;
    if (open) {
      h += '<div class="verified" id="verified"><h3>' + esc(p.answerLabel || "Verified answer") + ": " + esc(p.answer) + "</h3><p>" + esc(p.check) + "</p>" +
        "<h3>" + esc(p.storyLabel || "Worked answer") + "</h3>" + p.story + "</div>";
    } else {
      h += '<p class="pnote">The worked answer appears here after you close every step and press <b>Submit question</b>.</p>';
    }
    box.innerHTML = h;
    if (open) window.STORY.init(box);
    if (DATA.page === "lesson") {
      $("tab-concept").innerHTML = DATA.concepts[p.concept];
      window.STORY.init($("tab-concept"));
    }
  }
  function renderMySteps() {
    const p = byId[cur], s = S[cur];
    let h = '<div class="mysteps">';
    p.steps.forEach((st, i) => {
      const x = s.steps[i];
      const res = x.state === "ok" ? "✓ closed" : x.state === "handed" ? "answer handed over" : x.tries ? "open (" + x.tries + " tries)" : "not tried";
      h += '<div class="ms"><b>Step ' + (i + 1) + ":</b> " + esc(st.q) + '<br><span class="pnote">' + res + (x.hints ? ", hint opened" : "") +
        "</span>" + (x.work.trim() ? "<pre>" + esc(x.work) + "</pre>" : "") +
        (x.answers.length ? '<span class="pnote">Answers tried: ' + x.answers.map(esc).join(" · ") + "</span>" : "") + "</div>";
    });
    $("tab-steps").innerHTML = h + "</div>";
  }

  /* ---- right pane ---- */
  function renderRight() {
    const p = byId[cur], s = S[cur], st = p.steps[s.cur], x = s.steps[s.cur];
    const pills = $("pills");
    pills.innerHTML = "";
    p.steps.forEach((_, i) => {
      const b = el("button");
      b.type = "button";
      b.textContent = "Step " + (i + 1);
      const xi = s.steps[i];
      b.className = (i === s.cur ? "cur " : "") + (xi.state === "ok" ? "ok" : xi.state === "handed" ? "handed" : xi.tries ? "tried" : "");
      b.setAttribute("aria-label", "Step " + (i + 1) + (xi.state === "ok" ? ", closed" : xi.state === "handed" ? ", handed over" : ", open"));
      b.addEventListener("click", () => { saveWork(); s.cur = i; renderRight(); });
      pills.appendChild(b);
    });
    $("stepq").textContent = st.q;
    $("work").value = x.work;
    syncGutter();
    $("answer").value = "";
    $("answer").placeholder = st.ph;
    const closed = x.state !== "open";
    $("answer").disabled = closed;
    $("check").disabled = closed;
    $("hint").disabled = closed;
    $("stepstate").textContent = x.state === "ok" ? "Step closed. " + st.ok : x.state === "handed" ? "Answer handed over: " + st.reveal : (x.misses === 3 ? "One final attempt on this step." : "");
    $("reveal").textContent = "Show worked answer";
    $("confirmNote").textContent = "";
    s.confirmArmed = 0;
  }
  function saveWork() { if (cur) S[cur].steps[S[cur].cur].work = $("work").value; }
  function syncGutter() {
    const n = Math.max(6, $("work").value.split("\n").length);
    $("gutter").innerHTML = Array.from({ length: n }, (_, i) => i + 1).join("<br>");
    $("gutter").scrollTop = $("work").scrollTop;
  }

  /* ---- grading loop ---- */
  function nextOpen(s) {
    const n = s.steps.length;
    for (let k = 1; k <= n; k++) { const j = (s.cur + k) % n; if (s.steps[j].state === "open") return j; }
    return s.cur;
  }
  function checkStep() {
    const p = byId[cur], s = S[cur], i = s.cur, st = p.steps[i], x = s.steps[i];
    if (x.state !== "open") return;
    saveWork();
    const val = $("answer").value;
    const others = p.steps.map((o, k) => (k === i ? null : o.ans));
    const r = window.CHECK.grade(st, val, others);
    if (r.kind === "empty" || r.kind === "unread" || r.kind === "count" || r.kind === "form") { log("Step " + (i + 1) + ": " + esc(r.msg), "info"); return; }
    x.tries++;
    x.answers.push(val.trim());
    if (r.ok) {
      x.state = "ok";
      log("✓ Step " + (i + 1) + " closed (“" + esc(val.trim()) + "”). " + esc(st.ok), "ok");
      s.cur = nextOpen(s);
    } else {
      x.misses++;
      const nudge = st.nudges[Math.min(x.misses - 1, 2)];
      if (x.misses <= 3) {
        log("✗ Step " + (i + 1) + ", try " + x.misses + ": “" + esc(val.trim()) + "”. " + esc(r.msg) + " " + esc(nudge), "bad");
        if (x.misses === 3) log("One final attempt on step " + (i + 1) + ".", "hand");
      } else {
        x.state = "handed";
        log("✗ Step " + (i + 1) + ", final attempt: “" + esc(val.trim()) + "”. " + esc(r.msg), "bad");
        log("Handing over step " + (i + 1) + ": " + esc(st.reveal) + " Check: " + esc(st.check) + " Keep going with the next step yourself.", "hand");
        s.cur = nextOpen(s);
      }
    }
    renderRight();
    refreshNav();
    if (tab === "steps") renderMySteps();
  }
  function openHint() {
    const p = byId[cur], s = S[cur], st = p.steps[s.cur];
    s.steps[s.cur].hints++;
    $("hintTitle").textContent = "Hint for step " + (s.cur + 1);
    $("hintBody").textContent = st.hint;
    const hp = $("hintPic");
    hp.innerHTML = st.pic ? '<p class="cap2">Picture it (from plan step 2, Draw every fact):</p>' + st.pic : "";
    hp.hidden = !st.pic;
    $("hintDialog").classList.add("open");
    $("hintClose").focus();
    log("Hint opened for step " + (s.cur + 1) + " (doesn't use a try).", "info");
    refreshNav();
  }
  function closeHint() { $("hintDialog").classList.remove("open"); $("answer").focus(); }
  function submit() {
    const p = byId[cur], s = S[cur];
    saveWork();
    const open = s.steps.map((x, i) => (x.state === "open" ? i + 1 : null)).filter(Boolean);
    if (open.length) { log("Not yet: step" + (open.length > 1 ? "s " : " ") + open.join(", ") + " still open.", "info"); return; }
    const lines = s.steps.map((x, i) => "Step " + (i + 1) + ": " + (x.state === "handed" ? "handed over after 4 misses" : x.tries === 1 ? "first try" : "closed on try " + x.tries) + (x.hints ? ", hint used" : ""));
    log("Submitted. " + lines.join("; ") + ". Verified answer and worked story are open in the Problem tab.", "ok");
    s.submitted = true;
    setTab("problem");
    renderProblem();
    refreshNav();
  }
  function reveal() {
    const s = S[cur];
    const untried = s.steps.some((x) => x.state === "open" && x.tries === 0);
    if (untried && !(s.confirmArmed && Date.now() - s.confirmArmed < 8000)) {
      s.confirmArmed = Date.now();
      $("confirmNote").textContent = "Some steps haven't been tried yet. Press again to show the worked answer anyway.";
      $("reveal").textContent = "Yes, show it";
      return;
    }
    s.revealed = true;
    s.confirmArmed = 0;
    $("confirmNote").textContent = "";
    $("reveal").textContent = "Show worked answer";
    log("Worked answer shown.", "info");
    setTab("problem");
    renderProblem();
    refreshNav();
  }

  /* ---- selection ---- */
  function select(id) {
    if (!byId[id]) return;
    tick();
    saveWork();
    const from = cur;
    cur = id;
    document.dispatchEvent(new CustomEvent("bench:problem", { detail: { from, to: id } }));
    $("console").innerHTML = (S[id].log || []).join("");
    renderProblem();
    renderRight();
    setTab(DATA.page === "lesson" ? "concept" : "problem");
    refreshNav();
    window.SAFE.setHash(id);
    tick();
  }

  /* ---- wiring ---- */
  document.addEventListener("DOMContentLoaded", () => {
    buildNav();
    document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
    $("check").addEventListener("click", checkStep);
    $("hint").addEventListener("click", openHint);
    $("hintClose").addEventListener("click", closeHint);
    $("submit").addEventListener("click", submit);
    $("reveal").addEventListener("click", reveal);
    $("answer").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); checkStep(); } });
    $("work").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); checkStep(); } });
    $("work").addEventListener("input", () => { syncGutter(); saveWork(); refreshNav(); });
    $("work").addEventListener("scroll", syncGutter);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("hintDialog").classList.contains("open")) closeHint(); });
    $("hintDialog").addEventListener("click", (e) => { if (e.target === $("hintDialog")) closeHint(); });
    const h = window.SAFE.getHash();
    select(byId[h] ? h : P[0].id);
  });
  window.BENCH = { select, state: S, status, grade: () => checkStep(), current: () => cur };
})();

</script>
<script>
/* Teaching pen.
   Two viewport-sized canvases: `base` holds committed strokes, `live` holds only the stroke being drawn.
   While drawing, only the newest segments are painted; old strokes are never redrawn.
   Reading pages (data-penmode="page"): strokes are stored in page coordinates and stay on the content; a finger scrolls.
   Workbench pages (data-penmode="viewport"): strokes are viewport-anchored, the pen layer swallows scrolling,
   and ink is kept per problem through window.INK.get/set. */
(function () {
  "use strict";
  const MODE = document.body.dataset.penmode === "viewport" ? "viewport" : "page";
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const COLORS = [["ink", "#1C2A4A"], ["red", "#C23A2E"], ["blue", "#2D6BD0"], ["green", "#1E7A50"]];
  const WIDTHS = [2, 3.5, 6];
  const stats = { framesDrawing: 0, oldRedrawsWhileDrawing: 0, baseRedraws: 0, segmentsPainted: 0 };
  window.__PEN = { stats, mode: MODE, megapixels: () => 2 * (base.width * base.height) / 1e6, strokes: () => strokes };

  const base = document.createElement("canvas"), live = document.createElement("canvas");
  base.className = "pen-canvas base"; live.className = "pen-canvas live";
  base.setAttribute("aria-hidden", "true"); live.setAttribute("aria-hidden", "true");
  const bctx = base.getContext("2d"), lctx = live.getContext("2d");
  let strokes = [], undoStack = [], redoStack = [];
  let on = false, tool = "pen", color = COLORS[0][1], widthIdx = 1, stylusOnly = false;
  let drawing = null, raf = 0, scrollRaf = 0;

  function off() { return MODE === "page" ? [window.scrollX, window.scrollY] : [0, 0]; }

  function redrawBase() {

    stats.baseRedraws++;

  /* ---- pointer handling ---- */
  function accept(e) {

  }
  function pt(e, prev) {

    if (prev && tool === "pen") {

  }
  function move(e) {
    if (!drawing) return;

  }
  function up(e) {

    const s = drawing; drawing = null;
    delete s.drawn;
    if ((s.tool === "line" || s.tool === "box" || s.snapped) && s.pts.length > 1) s.pts = [s.pts[0], s.pts[s.pts.length - 1]];

    undoStack.push({ type: "add", stroke: s }); redoStack = [];

    persist();
  }
  function schedule() { if (!raf) raf = requestAnimationFrame(frame); }
  function frame() {

    if (!drawing) return;

  function eraseAt(e) {
    const [ox, oy] = off();

    for (let i = strokes.length - 1; i >= 0; i--) {
      const s = strokes[i];
      const near = s.pts.some((p) => Math.hypot(p[0] - x, p[1] - y) < 12) ||
        ((s.tool === "line" || s.tool === "box" || s.snapped) && nearShape(s, x, y));

  }
  function nearShape(s, x, y) {
    const a = s.pts[0], b = s.pts[s.pts.length - 1];
    const segs = s.tool === "box" ? [[a[0], a[1], b[0], a[1]], [b[0], a[1], b[0], b[1]], [b[0], b[1], a[0], b[1]], [a[0], b[1], a[0], a[1]]] : [[a[0], a[1], b[0], b[1]]];
    return segs.some(([x1, y1, x2, y2]) => {
      const L = Math.hypot(x2 - x1, y2 - y1) || 1, t = Math.max(0, Math.min(1, ((x - x1) * (x2 - x1) + (y - y1) * (y2 - y1)) / (L * L)));
      return Math.hypot(x - (x1 + t * (x2 - x1)), y - (y1 + t * (y2 - y1))) < 10;
    });
  }

  /* ---- history ---- */
  function undo() {
    const a = undoStack.pop(); if (!a) return;
    if (a.type === "add") strokes.splice(strokes.lastIndexOf(a.stroke), 1);
    else if (a.type === "erase") a.items.slice().reverse().forEach((it) => strokes.splice(it.index, 0, it.stroke));
    else if (a.type === "clear") strokes = a.items.slice();
    redoStack.push(a); redrawBase(); persist();
  }
  function redo() {
    const a = redoStack.pop(); if (!a) return;
    if (a.type === "add") strokes.push(a.stroke);
    else if (a.type === "erase") a.items.forEach((it) => { const i = strokes.indexOf(it.stroke); if (i >= 0) strokes.splice(i, 1); });
    else if (a.type === "clear") strokes = [];
    undoStack.push(a); redrawBase(); persist();
  }
  function clearAll() {
    if (!strokes.length) return;
    undoStack.push({ type: "clear", items: strokes.slice() }); redoStack = [];
    strokes = []; redrawBase(); persist();
  }
  function exportPng() {
    try {
      const a = document.createElement("a");
      a.href = base.toDataURL("image/png");
      a.download = "ink.png";
      document.body.appendChild(a); a.click(); a.remove();
      note("Saved the ink only (not the page underneath).");
    } catch (err) { note("Export isn't allowed here."); }
  }

  /* ---- per-problem ink (workbench) ---- */
  let problemId = null;
  function persist() { if (MODE === "viewport" && problemId && window.INK) window.INK.set(problemId, strokes.slice()); }
  document.addEventListener("bench:problem", (e) => {
    if (MODE !== "viewport") return;
    if (e.detail.from && window.INK) window.INK.set(e.detail.from, strokes.slice());
    problemId = e.detail.to;
    strokes = window.INK ? window.INK.get(problemId).slice() : [];
    undoStack = []; redoStack = [];
    redrawBase();
  });

  /* ---- toolbar ---- */
  const bar = document.createElement("div");
  bar.className = "pen-bar"; bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Teaching pen");
  const btn = (label, title, fn, pressed) => {
    const b = document.createElement("button"); b.type = "button"; b.innerHTML = label; b.title = title; b.setAttribute("aria-label", title);
    if (pressed !== undefined) b.setAttribute("aria-pressed", String(pressed));
    b.addEventListener("click", fn); return b;
  };
  const toggle = btn("✎ Pen", "Pen on/off (P)", () => setOn(!on), false);
  const tools = document.createElement("div"); tools.className = "tools";
  const toolBtns = {};
  [["pen", "✎", "Pen"], ["marker", "▬", "Marker"], ["line", "╱", "Straight line"], ["box", "▭", "Box"], ["eraser", "⌫", "Eraser"]].forEach(([k, g, t]) => {
    toolBtns[k] = btn(g, t, () => setTool(k), k === tool); tools.appendChild(toolBtns[k]);
  });
  tools.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  const colBtns = COLORS.map(([n, c], i) => { const b = btn('<span class="sw" style="background:' + c + '"></span>', n + " ink", () => setColor(i), i === 0); tools.appendChild(b); return b; });
  tools.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  const wBtns = WIDTHS.map((w, i) => { const b = btn(["thin", "medium", "thick"][i][0].toUpperCase(), ["Thin", "Medium", "Thick"][i] + " nib", () => setWidth(i), i === widthIdx); tools.appendChild(b); return b; });
  tools.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  tools.appendChild(btn("↶", "Undo", undo)); tools.appendChild(btn("↷", "Redo", redo)); tools.appendChild(btn("Clear", "Clear all ink (undoable)", clearAll));
  tools.appendChild(btn("PNG", "Export the ink only as a PNG image (not the page)", exportPng));
  const stylusBtn = btn("Stylus only", "Ignore finger touches (palm rejection)", () => { stylusOnly = !stylusOnly; stylusBtn.setAttribute("aria-pressed", String(stylusOnly)); }, false);
  tools.appendChild(stylusBtn);
  const noteEl = document.createElement("span"); noteEl.className = "note"; noteEl.setAttribute("aria-live", "polite");
  tools.appendChild(noteEl);
  bar.appendChild(toggle); bar.appendChild(tools);
  function note(t) { noteEl.textContent = t; }
  function setOn(v) {
    on = v;
    toggle.setAttribute("aria-pressed", String(on));
    bar.classList.toggle("open", on);
    live.classList.toggle("active", on);
    live.classList.toggle(MODE === "page" ? "touchpass" : "swallow", on);

  }
  function setTool(k) { tool = k; Object.entries(toolBtns).forEach(([n, b]) => b.setAttribute("aria-pressed", String(n === k))); }
  function setColor(i) { color = COLORS[i][1]; colBtns.forEach((b, j) => b.setAttribute("aria-pressed", String(i === j))); }
  function setWidth(i) { widthIdx = i; wBtns.forEach((b, j) => b.setAttribute("aria-pressed", String(i === j))); }

  /* ---- wiring ---- */
  function typing(e) { const t = e.target; return !!(t && t.closest && t.closest("input,textarea,select,[contenteditable=true]")); }
  document.addEventListener("keydown", (e) => {
    if (typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "p" || e.key === "P") { setOn(!on); e.preventDefault(); }
    else if (e.key === "Escape" && on) setOn(false);
  });
  live.addEventListener("pointerdown", down);
  live.addEventListener("pointermove", move);
  live.addEventListener("pointerup", up);
  live.addEventListener("pointercancel", up);
  if (MODE === "page") {
    window.addEventListener("scroll", () => { if (!scrollRaf) scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; redrawBase(); }); }, { passive: true });
    // wheel over the active pen layer still scrolls the page
    live.addEventListener("wheel", (e) => { window.scrollBy(e.deltaX, e.deltaY); }, { passive: true });
  } else {
    live.addEventListener("wheel", (e) => { if (on) e.preventDefault(); }, { passive: false });
  }
  window.addEventListener("resize", size);
  document.addEventListener("DOMContentLoaded", () => {
    document.body.appendChild(base); document.body.appendChild(live); document.body.appendChild(bar);
    size();
  });
  window.PEN = { setOn, setTool, setColor, setWidth, undo, redo, clearAll, exportPng, isOn: () => on, setStylusOnly: (v) => { stylusOnly = v; stylusBtn.setAttribute("aria-pressed", String(v)); } };
})();

</script>
